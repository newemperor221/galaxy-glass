<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#020203">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2216%22%20fill%3D%22%2310b981%22%2F%3E%3Ctext%20x%3D%2250%22%20y%3D%2268%22%20font-size%3D%2255%22%20text-anchor%3D%22middle%22%20fill%3D%22white%22%3EGG%3C%2Ftext%3E%3C%2Fsvg%3E">
  <title>Komari Monitor</title>
  <meta name="description" content="A simple server monitor tool.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles/tokens.css?v=7">
  <link rel="stylesheet" href="styles/reset.css?v=7">
  <link rel="stylesheet" href="styles/layout.css?v=7">
  <link rel="stylesheet" href="styles/components.css?v=7">
  <link rel="stylesheet" href="styles/responsive.css?v=7">
</head>
<body>
<div class="bg-layer">
  <img id="poster" src="https://img.357561.xyz/image-wallpaper2.png" alt="" style="opacity: 0;">
  <video id="bg-video" muted loop playsinline src="https://img.357561.xyz/wallpaper1.mp4" style="opacity: 1;"></video>
</div>

<div class="page" id="app">
  <!-- Navbar -->
  <nav class="navbar" id="navbar" role="navigation" aria-label="主导航">
    <div class="container">
      <div class="navbar-inner">
        <a href="/" class="navbar-brand" aria-label="返回首页">
          <span class="navbar-title" id="site-name">GG 探针</span>
        </a>
        <div class="navbar-actions">
          <div class="search-box" id="search-box" role="search">
            <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg></span>
            <input id="search-input" type="text" placeholder="搜索" aria-label="搜索">
          </div>
          <div class="dropdown">
            <button class="sort-btn" id="sort-btn" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13" aria-hidden="true"><path fill-rule="evenodd" d="M3 6.75A.75.75 0 0 1 3.75 6h16.5a.75.75 0 0 1 0 1.5H3.75A.75.75 0 0 1 3 6.75ZM3 12a.75.75 0 0 1 .75-.75h16.5a.75.75 0 0 1 0 1.5H3.75A.75.75 0 0 1 3 12Zm0 5.25a.75.75 0 0 1 .75-.75h16.5a.75.75 0 0 1 0 1.5H3.75a.75.75 0 0 1-.75-.75Z" clip-rule="evenodd"></path></svg>
              <span id="sort-label">默认</span>
            </button>
            <div class="dropdown-menu hidden" id="sort-menu" role="menu">
              <button class="dropdown-item active" data-sort="default" role="menuitem">默认</button>
              <button class="dropdown-item" data-sort="name" role="menuitem">名称</button>
              <button class="dropdown-item" data-sort="region" role="menuitem">地区</button>
              <button class="dropdown-item" data-sort="cpu" role="menuitem">CPU 占用</button>
              <button class="dropdown-item" data-sort="mem" role="menuitem">内存占用</button>
              <button class="dropdown-item" data-sort="disk" role="menuitem">磁盘占用</button>
              <button class="dropdown-item" data-sort="down" role="menuitem">下行速度</button>
              <button class="dropdown-item" data-sort="up" role="menuitem">上行速度</button>
              <button class="dropdown-item" data-sort="uptime" role="menuitem">在线时长</button>
            </div>
          </div>
          <span class="sort-btn online-pill">
            <svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13" aria-hidden="true"><path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25Zm-2.625 6c-.54 0-.828.419-.936.634a1.96 1.96 0 0 0-.189.866c0 .298.059.605.189.866.108.215.395.634.936.634.54 0 .828-.419.936-.634.13-.26.189-.568.189-.866 0-.298-.059-.605-.189-.866-.108-.215-.395-.634-.936-.634Zm4.314 0c-.54 0-.828.419-.936.634a1.96 1.96 0 0 0-.189.866c0 .298.059.605.189.866.108.215.395.634.936.634.54 0 .828-.419.936-.634.13-.26.189-.568.189-.866 0-.298-.059-.605-.189-.866-.108-.215-.395-.634-.936-.634ZM12 13.5a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z" clip-rule="evenodd"/></svg>
            在线 1 人
          </span>
        </div>
      </div>
    </div>
  </nav>

  <!-- List View -->
  <div id="list-view">
    <main class="container main">
      <div class="stats-grid" id="stats-bar" role="status">
        <div class="stat-card"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25ZM12.75 6a.75.75 0 0 0-1.5 0v6c0 .414.336.75.75.75h4.5a.75.75 0 0 0 0-1.5h-3.75V6Z" clip-rule="evenodd"/></svg><div><div class="label">当前时间</div><div class="value" id="stat-time-value">--:--:--</div></div></div>
        <div class="stat-card"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.08 5.227A3 3 0 0 1 6.979 3H17.02a3 3 0 0 1 2.9 2.227l2.113 7.926A5.228 5.228 0 0 0 18.75 12H5.25a5.228 5.228 0 0 0-3.284 1.153L4.08 5.227Z"></path><path fill-rule="evenodd" d="M5.25 13.5a3.75 3.75 0 1 0 0 7.5h13.5a3.75 3.75 0 1 0 0-7.5H5.25Zm10.5 4.5a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm3.75-.75a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" clip-rule="evenodd"></path></svg><div><div class="label">在线服务器</div><div id="stat-online-value" class="value">--/--</div><div class="stat-sub" id="stat-region-value">加载中…</div></div></div>
        <div class="stat-card"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M3 6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6Zm4.5 7.5a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0v-2.25a.75.75 0 0 1 .75-.75Zm3.75-1.5a.75.75 0 0 0-1.5 0v4.5a.75.75 0 0 0 1.5 0V12Zm2.25-3a.75.75 0 0 1 .75.75v6.75a.75.75 0 0 1-1.5 0V9.75A.75.75 0 0 1 13.5 9Zm3.75-1.5a.75.75 0 0 0-1.5 0v9a.75.75 0 0 0 1.5 0v-9Z" clip-rule="evenodd"></path></svg><div><div class="label">流量概览</div><div class="value small"><span id="stat-traffic-up">↑ --</span> · <span id="stat-traffic-down">↓ --</span></div><div class="stat-sub" id="stat-traffic-rate">⚡↑ -- · ⚡↓ --</div></div></div>
        <div class="stat-card"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.464 8.746c.227-.18.497-.311.786-.394v2.795a2.252 2.252 0 0 1-.786-.393c-.394-.313-.546-.681-.546-1.004 0-.323.152-.691.546-1.004ZM12.75 15.662v-2.824c.347.085.664.228.921.421.427.32.579.686.579.991 0 .305-.152.671-.579.991a2.534 2.534 0 0 1-.921.42Z"></path><path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25ZM12.75 6a.75.75 0 0 0-1.5 0v.816a3.836 3.836 0 0 0-1.72.756c-.712.566-1.112 1.35-1.112 2.178 0 .829.4 1.612 1.113 2.178.502.4 1.102.647 1.719.756v2.978a2.536 2.536 0 0 1-.921-.421l-.879-.66a.75.75 0 0 0-.9 1.2l.879.66c.533.4 1.169.645 1.821.75V18a.75.75 0 0 0 1.5 0v-.81a4.124 4.124 0 0 0 1.821-.749c.745-.559 1.179-1.344 1.179-2.191 0-.847-.434-1.632-1.179-2.191a4.122 4.122 0 0 0-1.821-.75V8.354c.29.082.559.213.786.393l.415.33a.75.75 0 0 0 .933-1.175l-.415-.33a3.836 3.836 0 0 0-1.719-.755V6Z" clip-rule="evenodd"></path></svg><div><div class="label">月度开销 · 剩余折旧</div><div class="value small" id="stat-cost-monthly">--</div><div class="stat-sub"><span id="stat-cost-usd">--</span><span id="stat-cost-rate" style="margin-left:auto;"></span></div></div></div>
      </div>
      <div class="region-filters-wrap" id="region-filters">
        <div class="filters-wrap">
          <div class="filters" id="filters-container">
            <div class="filter-slider" id="filter-slider"></div>
          </div>
        </div>
      </div>
      <div class="nodes-grid-wrap">
        <div class="nodes-grid" id="grid-view"></div>
      </div>
    </main>
  </div>

  <!-- Detail View -->
  <div class="detail-view hidden" id="detail-view">
    <div class="detail-nav" id="detail-nav">
      <div class="container">
        <div class="detail-nav-inner">
          <button class="back-btn" id="detail-back" tabindex="0">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M7.72 12.53a.75.75 0 0 1 0-1.06l7.5-7.5a.75.75 0 1 1 1.06 1.06L9.31 12l6.97 6.97a.75.75 0 1 1-1.06 1.06l-7.5-7.5Z" clip-rule="evenodd"></path></svg>返回
          </button>
          <div class="detail-title-area">
            <span class="detail-name" id="detail-name"></span>
            <span class="detail-meta" id="detail-meta"></span>
          </div>
        </div>
      </div>
    </div>
    <main class="container main">
      <div class="detail-content-wrap">
        <div class="detail-content">
          <div class="detail-loading" id="detail-loading"><span>加载详情…</span></div>
          <div class="detail-error hidden" id="detail-error"></div>
          <div class="detail-body hidden" id="detail-content">
            <div class="detail-left">
              <div class="metrics-grid" id="detail-metrics"></div>
              <div class="sysinfo-card" id="detail-sysinfo"></div>
              <div class="tags-card" id="detail-tags"></div>
            </div>
            <div class="detail-right">
              <div class="chart-card">
                <div style="display:flex;align-items:center;gap:6px">
                  <div class="chart-title">CPU 占用率</div>
                  <div class="chart-badge" id="badge-cpu" style="color:var(--accent)">—</div>
                  <button class="chart-pause-btn" id="pause-cpu" data-chart="cpu">⏸ 暂停</button>
                </div>
                <div class="chart-canvas"><canvas id="chart-cpu" role="img" aria-label="CPU 占用率实时图表"></canvas></div>
              </div>
              <div class="chart-card">
                <div style="display:flex;align-items:center;gap:6px">
                  <div class="chart-title">内存占用率</div>
                  <div class="chart-badge" id="badge-mem" style="color:var(--chart-mem)">—</div>
                  <button class="chart-pause-btn" id="pause-mem" data-chart="mem">⏸ 暂停</button>
                </div>
                <div class="chart-canvas"><canvas id="chart-mem" role="img" aria-label="内存占用率实时图表"></canvas></div>
              </div>
              <div class="chart-card">
                <div class="chart-header">
                  <div class="chart-header-left">
                    <div class="chart-title">网络速率</div>
                    <div class="chart-badge" id="badge-net" style="color:var(--text-secondary)">—</div>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px">
                    <button class="chart-pause-btn" id="pause-net" data-chart="net">⏸ 暂停</button>
                    <div class="chart-legend">
                      <span class="legend-up">↑ 上行</span>
                      <span class="legend-down">↓ 下行</span>
                    </div>
                  </div>
                </div>
                <div class="chart-canvas"><canvas id="chart-net" role="img" aria-label="网络速率实时图表，上行和下行"></canvas></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Footer -->
  <footer class="footer" role="contentinfo">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand" id="footer-brand">GG 探针</div>
        <div class="footer-uptime" id="footer-uptime">GG 探针 · 已稳定运行 0 日 0 时 0 分</div>
        <div class="footer-powered">Powered by <a href="https://github.com/komari-monitor/komari" target="_blank" rel="noopener">Komari</a></div>
      </div>
    </div>
  </footer>

  <!-- Toast & Back to Top -->
  <div class="conn-toast" id="conn-toast"></div>
  <button class="back-to-top" id="back-to-top" aria-label="回到顶部" tabindex="0">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M11.47 7.72a.75.75 0 0 1 1.06 0l7.5 7.5a.75.75 0 1 1-1.06 1.06L12 9.31l-6.97 6.97a.75.75 0 0 1-1.06-1.06l7.5-7.5Z" clip-rule="evenodd"></path></svg>
  </button>
</div>

<!-- Scripts -->
<script src="scripts/squircle.js?v=1"></script>
<script src="scripts/config.js?v=6"></script>
<script src="scripts/data.js?v=6"></script>
<script src="scripts/render.js?v=6"></script>
<script src="scripts/charts.js?v=6"></script>
<script src="scripts/events.js?v=6"></script>
<script>
'use strict';
setupEvents();
setupScroll();
loadData().then(function() {
  var v = $('bg-video');
  if (window.matchMedia('prefers-reduced-motion:reduce').matches) { v.style.opacity = '0'; $('poster').style.opacity = '1'; return; }
  var io = new IntersectionObserver(function(e) {
    if (e[0].isIntersecting) {
      v.play().then(function() { v.style.opacity = '1'; $('poster').style.opacity = '0'; }).catch(function() {});
      io.disconnect();
    }
  });
  io.observe(v);
});
startClock();
startFooterUptime();
setupRouter();
</script>
</body>
</html>
