<!DOCTYPE html>
<!-- GalaxyGlass v2.0.0 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>GG 探针</title>
  <meta name="description" content="GalaxyGlass — 银河玻璃探针面板">
  <style>
    /* ══════════════════════════════════════════════════
       GalaxyGlass v2.0.0 — 银河玻璃
       Deep dark theme for Komari Monitor
       ══════════════════════════════════════════════════ */

    /* ── Design Tokens ── */
    :root {
      /* Core palette */
      --accent:        #10b981;
      --accent-2:      #6366f1;
      --accent-gradient: linear-gradient(135deg, #10b981, #6366f1);
      --accent-orange: #f59e0b;
      --danger:        #ef4444;
      --success:       #22c55e;
      --warning:       #eab308;

      /* Background layers */
      --bg-deepest:    #050d07;
      --bg-deep:       #071109;
      --bg-surface:    #0a1a0f;
      --bg-raised:     rgba(255,255,255,0.03);
      --bg-glass:      rgba(0, 0, 0, 0.35);

      /* Text */
      --text-primary:   #f0fdf4;
      --text-secondary: rgba(240, 253, 244, 0.65);
      --text-muted:     rgba(240, 253, 244, 0.32);

      /* Glass */
      --glass-bg:       rgba(255,255,255,0.03);
      --glass-border:   rgba(255,255,255,0.06);
      --glass-hover:    rgba(255,255,255,0.06);
      --glass-strong:   rgba(255,255,255,0.09);

      /* Charts */
      --chart-cpu:      #10b981;
      --chart-mem:      #6366f1;
      --chart-up:       #f59e0b;
      --chart-down:     #10b981;

      /* Dimensions */
      --radius-sm:      8px;
      --radius-md:      12px;
      --radius-lg:      16px;
      --radius-xl:      20px;
      --radius-full:    9999px;
      --gap:            16px;
      --gap-sm:         10px;
      --gap-xs:         6px;
      --container-max:  1280px;
      --container-pad:  1.75rem;

      /* Typography */
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
      --font-size:      13px;
      --font-size-sm:   11px;
      --font-size-mono: 12px;
    }

    /* ── Reset ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: var(--font-size); overflow-y: scroll; scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-surface);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; }

    /* ── Background Layer ── */
    .bg-layer {
      position: fixed; inset: 0; z-index: -1;
      background: var(--bg-deep);
    }
    .bg-layer img, .bg-layer video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* ── Page Layout ── */
    .page {
      min-height: 100vh;
      display: flex; flex-direction: column;
      position: relative; z-index: 10;
    }

    /* ── Container ── */
    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 var(--container-pad);
      width: 100%;
    }

    /* ── Navbar ── */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: transparent;
      border-bottom: 1px solid transparent;
      transition: background 0.35s ease, backdrop-filter 0.35s ease, border-color 0.35s ease;
    }
    .navbar.scrolled {
      background: rgba(5, 13, 7, 0.7) !important;
      backdrop-filter: blur(24px) saturate(120%);
      -webkit-backdrop-filter: blur(24px) saturate(120%);
      border-bottom: 1px solid var(--glass-border);
    }
    .navbar-inner {
      display: flex; align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.7rem 0;
      height: 52px;
    }
    .navbar-brand {
      display: flex; align-items: center; gap: 0.5rem;
      font-weight: 600; letter-spacing: 0.02em;
      flex-shrink: 0; height: 2rem;
      transition: opacity 0.2s;
    }
    .navbar-brand:hover { opacity: 0.8; }
    .navbar-logo {
      width: 1.4rem; height: 1.4rem;
      border-radius: 4px; object-fit: contain; flex-shrink: 0;
    }
    .navbar-title {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 18px; font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .navbar-actions {
      display: flex; align-items: center; gap: 0.4rem;
      flex-shrink: 0;
    }
    .navbar-mobile-search {
      padding: 0.25rem 0 0.65rem;
    }
    .navbar-mobile-search.hidden { display: none; }
    @media (min-width: 640px) {
      .navbar-mobile-search { display: none !important; }
      #mobile-search-btn { display: none !important; }
    }
    @media (max-width: 639px) {
      #mobile-search-btn { display: inline-flex !important; }
      .search-box { display: none !important; }
    }

    /* ── Search Box ── */
    .search-box {
      display: flex; align-items: center;
      border-radius: var(--radius-full);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: max-width 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  border-color 0.3s ease, background 0.3s ease;
      max-width: 36px; height: 36px; overflow: hidden;
    }
    .search-box:focus-within,
    .search-box.open {
      max-width: 260px;
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(255,255,255,0.05);
    }
    .search-box .search-icon {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .search-box .search-icon svg {
      width: 15px; height: 15px;
      color: var(--text-muted);
      transition: color 0.3s;
    }
    .search-box:focus-within .search-icon svg,
    .search-box.open .search-icon svg {
      color: var(--accent);
    }
    .search-box input {
      flex: 1;
      background: transparent; border: none; outline: none;
      color: var(--text-primary); font-size: 13px;
      padding: 0 14px 0 0;
      opacity: 0; transition: opacity 0.3s 0.15s;
      min-width: 0;
    }
    .search-box.open input,
    .search-box:focus-within input { opacity: 1; }
    input::placeholder { color: var(--text-muted); }

    /* ── Icon Button ── */
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 0.35rem;
      height: 36px; padding: 0 12px;
      font-size: 13px; font-weight: 500;
      border-radius: var(--radius-full);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .icon-btn:hover {
      color: var(--text-primary);
      background: var(--glass-hover);
      border-color: rgba(255,255,255,0.12);
    }
    .icon-btn.round { width: 36px; padding: 0; flex-shrink: 0; }

    /* ── View Toggle ── */
    .view-toggle {
      display: none;
      grid-template-columns: repeat(2, 1fr);
      position: relative;
      border-radius: var(--radius-full);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 3px; gap: 2px;
      height: 36px;
    }
    @media (min-width: 640px) { .view-toggle { display: inline-grid; } }
    .view-toggle-slider {
      position: absolute; top: 3px; left: 3px;
      width: calc(50% - 3px); height: calc(100% - 6px);
      border-radius: var(--radius-full);
      background: var(--glass-strong);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    .view-toggle-slider.table { transform: translateX(100%); }
    .view-toggle-btn {
      position: relative; z-index: 10;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 5px; padding: 4px 14px;
      font-size: 13px; font-weight: 500;
      border-radius: var(--radius-full);
      background: transparent; border: none;
      cursor: pointer;
      color: var(--text-secondary);
      transition: color 0.2s;
      white-space: nowrap;
    }
    .view-toggle-btn.active { color: var(--text-primary); }
    .view-toggle-btn svg { width: 14px; height: 14px; }

    /* ── Dropdown ── */
    .dropdown { position: relative; }
    .dropdown-menu {
      position: absolute; right: 0; margin-top: 6px;
      min-width: 150px; z-index: 200;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: rgba(5, 13, 7, 0.88);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
      padding: 6px;
      animation: fadeIn 0.12s ease;
    }
    .dropdown-menu.hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .dropdown-item {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; width: 100%;
      padding: 8px 12px; font-size: 13px;
      color: var(--text-secondary);
      background: transparent; border: none;
      border-radius: var(--radius-sm); cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .dropdown-item:hover { background: var(--glass-hover); color: var(--text-primary); }
    .dropdown-item.active { color: var(--accent); background: rgba(16,185,129,0.1); }

    /* ── Main Content ── */
    .main {
      flex: 1;
      padding: 1.75rem 0;
      display: flex; flex-direction: column;
      gap: 1rem;
    }
    @media (min-width: 640px) { .main { padding: 2rem 0; } }

    /* ── Accent Bar ── */
    .accent-bar {
      width: 72px; height: 3px;
      background: var(--accent-gradient);
      border-radius: var(--radius-full);
      margin-bottom: 14px;
    }

    /* ── Stats Grid ── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: var(--gap);
    }
    @media (max-width: 639px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    .stat-card {
      display: flex; align-items: center;
      gap: var(--gap-sm);
      padding: 16px 20px;
      border-radius: var(--radius-lg);
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid var(--glass-border);
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s;
    }
    .stat-card:hover {
      border-color: rgba(16,185,129,0.18);
      box-shadow: 0 0 0 1px rgba(16,185,129,0.06);
      transform: translateY(-1px);
    }
    .stat-card svg {
      width: 1.8rem; height: 1.8rem;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: color 0.3s;
    }
    .stat-card:hover svg { color: var(--accent); }
    .stat-card .label {
      font-size: 10px; color: var(--text-muted);
      margin-bottom: 3px; letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .stat-card .value {
      font-size: 15px; font-weight: 700;
      font-family: var(--font-mono);
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    .stat-card .value.small { font-size: 12px; }
    .stat-sub {
      display: flex; align-items: center; gap: 4px;
      font-size: 12px; font-family: var(--font-mono);
      color: var(--text-secondary);
    }
    .stat-sub-row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 2px 12px;
    }

    /* ── Region Filters ── */
    .region-filters-wrap {
      padding: 0 var(--container-pad);
    }
    .filters {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .chip {
      display: inline-flex; align-items: center;
      gap: 6px;
      padding: 7px 14px;
      font-size: 12px;
      border-radius: var(--radius-full);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover {
      background: var(--glass-hover);
      color: var(--text-primary);
    }
    .chip.active {
      border-color: rgba(16,185,129,0.4);
      background: linear-gradient(135deg, rgba(16,185,129,0.12), rgba(99,102,241,0.08));
      color: var(--accent);
      box-shadow: 0 0 16px rgba(16,185,129,0.06);
    }

    /* ── Node Grid ── */
    .nodes-grid-wrap {
      padding: 0 var(--container-pad);
    }
    .nodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: var(--gap);
      min-height: calc(100vh - 380px);
    }
    @media (min-width: 1600px) {
      .nodes-grid { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
    }
    @media (max-width: 680px) {
      .nodes-grid { grid-template-columns: 1fr; }
    }

    /* ── Node Card ── */
    .node-card {
      display: flex; flex-direction: column;
      gap: 10px;
      padding: 1.1rem;
      border-radius: var(--radius-lg);
      background: var(--bg-glass);
      backdrop-filter: blur(80px) saturate(120%);
      -webkit-backdrop-filter: blur(80px) saturate(120%);
      border: 1px solid var(--glass-border);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.35s ease,
                  border-color 0.25s ease;
      cursor: pointer;
      min-height: 170px;
      animation: cardIn 0.4s ease both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .node-card:hover {
      transform: translateY(-4px) scale(1.015);
      box-shadow: 0 24px 48px rgba(0,0,0,0.35), 0 0 0 1px rgba(16,185,129,0.1);
      border-color: rgba(16,185,129,0.15);
    }
    .node-card.offline { opacity: 0.45; }
    .node-card-header {
      display: flex; align-items: center; gap: 8px;
    }
    .node-status {
      width: 7px; height: 7px;
      border-radius: 50%; flex-shrink: 0;
    }
    .node-status.online {
      background: var(--accent);
      box-shadow: 0 0 6px rgba(16,185,129,0.5);
      animation: pulse-dot 2.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px rgba(16,185,129,0.5); }
      50% { opacity: 0.6; box-shadow: 0 0 3px rgba(16,185,129,0.15); }
    }
    .node-status.offline { background: var(--danger); }
    .node-os-icon {
      width: 18px; height: 18px;
      border-radius: 3px; object-fit: contain; flex-shrink: 0;
    }
    .node-name {
      font-weight: 600;
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .node-flag {
      width: 26px; height: 18px;
      object-fit: cover; border-radius: 2px; flex-shrink: 0;
    }
    .node-region {
      display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    }
    .node-specs {
      font-size: var(--font-size-sm);
      font-family: var(--font-mono);
      color: var(--text-muted);
      padding: 2px 0;
      display: flex; gap: 8px; flex-wrap: wrap;
      line-height: 1.4;
    }

    /* ── Metrics ── */
    .metrics { display: flex; flex-direction: column; gap: 8px; }
    .metric-row { display: flex; flex-direction: column; gap: 3px; }
    .metric-header {
      display: flex; justify-content: space-between;
      font-size: var(--font-size-mono);
    }
    .metric-label {
      color: var(--text-secondary);
      font-size: 10px;
    }
    .metric-value {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 11px;
    }
    .metric-bar {
      height: 5px;
      background: rgba(255,255,255,0.07);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .metric-fill {
      height: 100%;
      border-radius: var(--radius-full);
      transform-origin: left;
      transition: transform 0.4s ease;
    }
    .metric-fill.low    { background: var(--accent); }
    .metric-fill.medium { background: var(--accent-orange); }
    .metric-fill.high   { background: var(--danger); }
    .metric-sub {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }
    .network-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 2px 0;
    }
    .network-item {
      display: flex; align-items: center; gap: 4px;
      font-size: var(--font-size-mono);
      color: var(--text-secondary);
    }
    .network-item svg { width: 11px; height: 11px; }

    /* ── Card Footer ── */
    .node-footer {
      padding-top: 8px;
      border-top: 1px solid var(--glass-border);
      font-size: var(--font-size-mono);
      color: var(--text-muted);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .node-footer-sep {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      flex-shrink: 0;
    }
    .node-footer-item {
      display: flex; align-items: center; gap: 4px;
      white-space: nowrap;
    }
    .node-footer-item svg { width: 11px; height: 11px; }
    .price-badge {
      margin-left: auto;
      font-weight: 700;
      color: #fff;
      background: var(--accent-gradient);
      padding: 2px 10px;
      border-radius: var(--radius-full);
      font-size: var(--font-size-sm);
      line-height: 1.4;
    }

    /* ── Tags ── */
    .node-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag {
      padding: 2px 8px;
      font-size: 9px;
      border-radius: 5px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
    }

    /* ── Table View ── */
    .table-view-wrap {
      padding: 0 var(--container-pad);
    }
    .table-view {
      display: flex; flex-direction: column; gap: var(--gap);
      width: 100%;
    }
    @media (max-width: 639px) { .table-view { display: none !important; } }
    #table-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
    }
    .table-row {
      display: flex; flex-direction: column;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: var(--bg-glass);
      backdrop-filter: blur(60px) saturate(120%);
      -webkit-backdrop-filter: blur(60px) saturate(120%);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      gap: 7px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.3s ease,
                  border-color 0.25s ease;
      animation: cardIn 0.35s ease both;
    }
    .table-row:hover {
      transform: translateY(-4px) scale(1.015);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 0 1px rgba(16,185,129,0.1);
      border-color: rgba(16,185,129,0.15);
    }
    .table-row.offline { opacity: 0.45; }
    .row-title {
      display: flex; align-items: center; gap: 6px;
    }
    .name-text {
      font-size: 13px; font-weight: 600; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1; min-width: 0;
    }
    .table-flag { width: 22px; height: 15px; object-fit: cover; border-radius: 2px; flex-shrink: 0; }

    /* Table meters */
    .row-meters { display: flex; flex-direction: column; gap: 3px; }
    .meter-row {
      display: flex; align-items: center; gap: 6px;
    }
    .meter-label {
      font-size: 10px; font-weight: 600;
      width: 24px; color: var(--text-muted);
      flex-shrink: 0; text-align: right;
    }
    .meter-bar {
      flex: 1; height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .meter-fill {
      height: 100%; border-radius: var(--radius-full);
      transform-origin: left;
      transition: transform 0.4s ease;
    }
    .meter-fill.ok     { background: var(--accent); }
    .meter-fill.warn   { background: var(--accent-orange); }
    .meter-fill.danger { background: var(--danger); }
    .meter-value {
      font-size: var(--font-size-mono);
      font-weight: 600;
      width: 38px; text-align: right; flex-shrink: 0;
    }
    .row-footer {
      display: flex; align-items: center; gap: 6px;
      font-size: var(--font-size-sm);
      font-family: var(--font-mono);
      color: var(--text-muted);
      flex-wrap: wrap;
      padding-top: 6px;
      border-top: 1px solid var(--glass-border);
    }

    /* ── Loading / Empty states ── */
    .loading-state, .empty-state {
      padding: 0 var(--container-pad);
      display: flex; align-items: center; justify-content: center;
      padding-top: 4rem;
      color: var(--text-muted);
      font-size: 14px;
      gap: 8px;
    }
    .loading-state .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--glass-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Detail View ── */
    .detail-view.hidden { display: none !important; }
    .detail-view {
      animation: fadeIn 0.2s ease;
    }
    .detail-nav {
      position: sticky; top: 0; z-index: 100;
      background: transparent;
      border-bottom: 1px solid transparent;
      transition: background 0.3s, backdrop-filter 0.3s, border-color 0.3s;
      min-height: 52px;
    }
    .detail-nav.scrolled {
      background: rgba(5, 13, 7, 0.7);
      backdrop-filter: blur(24px) saturate(120%);
      -webkit-backdrop-filter: blur(24px) saturate(120%);
      border-bottom: 1px solid var(--glass-border);
    }
    .detail-nav-inner {
      display: flex; align-items: center; gap: 12px;
      padding: 0.7rem 0; height: 52px;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 13px; font-weight: 500;
      color: var(--text-secondary);
      background: transparent; border: none;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      transition: color 0.2s, background 0.2s;
    }
    .back-btn:hover {
      color: var(--text-primary);
      background: var(--glass-bg);
    }
    .back-btn svg { width: 16px; height: 16px; }
    .detail-title-area {
      display: flex; align-items: center; gap: 8px;
      flex: 1; min-width: 0;
    }
    .detail-name { font-weight: 600; font-size: 15px; }
    .detail-flag { width: 24px; height: 16px; object-fit: cover; border-radius: 2px; flex-shrink: 0; }
    .detail-meta {
      font-size: 12px; color: var(--text-muted);
      display: flex; align-items: center; gap: 6px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .detail-loading, .detail-error {
      display: flex; align-items: center; justify-content: center;
      padding-top: 4rem;
      color: var(--text-muted);
      font-size: 14px;
    }
    .detail-error { color: var(--danger); }

    /* Detail content layout */
    .detail-content-wrap {
      padding: 0 var(--container-pad);
      padding-top: 0.5rem;
    }
    .detail-content { max-width: var(--container-max); margin: 0 auto; }
    .detail-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
      margin-top: var(--gap);
    }
    @media (max-width: 800px) { .detail-body { grid-template-columns: 1fr; } }

    /* Detail left column */
    .detail-left {
      display: flex; flex-direction: column; gap: var(--gap);
    }
    .detail-right {
      display: flex; flex-direction: column; gap: var(--gap);
    }

    /* Metrics grid (3-col) */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--gap-sm);
    }
    @media (max-width: 480px) { .metrics-grid { grid-template-columns: repeat(2, 1fr); } }
    .metric-card {
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: border-color 0.2s;
    }
    .metric-card:hover { border-color: rgba(255,255,255,0.1); }
    .metric-card .metric-sub {
      margin-top: 2px;
    }
    .metric-card .metric-bar {
      margin-top: 6px;
    }

    /* Sysinfo */
    .sysinfo-card {
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .sysinfo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-width: 0;
    }
    .sysinfo-grid > div { min-width: 0; overflow: hidden; }
    .sysinfo-row {
      display: flex; justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid var(--glass-border);
      gap: 12px;
    }
    .sysinfo-row:last-child { border-bottom: none; }
    .sysinfo-row .lbl {
      font-size: 11px; color: var(--text-muted);
      flex-shrink: 0;
    }
    .sysinfo-row .val {
      font-size: 11px; color: var(--text-primary);
      text-align: right;
      font-family: var(--font-mono);
      min-width: 0;
    }
    .load-row {
      display: flex; gap: 4px;
    }
    .load-badge {
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }
    .load-badge.low    { background: rgba(16,185,129,0.15); color: var(--accent); }
    .load-badge.medium { background: rgba(245,158,11,0.15); color: var(--accent-orange); }
    .load-badge.high   { background: rgba(239,68,68,0.15); color: var(--danger); }

    .sysinfo-bill {
      grid-column: 1 / -1;
      display: flex; gap: 8px; flex-wrap: wrap;
      padding-top: 8px; margin-top: 4px;
      border-top: 1px solid var(--glass-border);
    }
    .bill-chip {
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-size: var(--font-size-sm);
      font-family: var(--font-mono);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
    }
    .bill-chip.danger { border-color: rgba(239,68,68,0.3); color: var(--danger); }

    /* Tags card */
    .tags-card {
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .tags-card.hidden { display: none; }
    .tags-title { font-size: 10px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.03em; text-transform: uppercase; }
    .tags-list { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .tag-chip {
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);

    .tag-chip-warm { background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.2); color: #fcd34d; }
    .conn-row { display: flex; gap: 10px; font-size: 11px; color: var(--text-muted); }
    .conn-item strong { color: var(--text-primary); font-weight: 600; }

    /* Traffic card */
    .traffic-card {
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .traffic-title { font-size: 10px; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.03em; text-transform: uppercase; }
    .traffic-row { font-size: var(--font-size-mono); padding: 4px 0; display: flex; align-items: center; gap: 6px; }
    .traffic-row .dir { font-weight: 700; }
    .traffic-row .dir.up   { color: var(--accent-orange); }
    .traffic-row .dir.down { color: var(--accent); }
    .traffic-bar-wrap { margin: 6px 0; }
    .traffic-bar-bg { height: 5px; background: rgba(255,255,255,0.06); border-radius: var(--radius-full); overflow: hidden; }
    .traffic-bar-fill {
      height: 100%; border-radius: var(--radius-full);
      background: var(--accent-gradient);
      transform-origin: left;
      transition: transform 0.4s ease;
    }
    .traffic-bar-fill.warn  { background: linear-gradient(90deg, var(--accent-orange), var(--warning)); }
    .traffic-bar-fill.danger { background: linear-gradient(90deg, var(--danger), #ef4444); }
    .traffic-summary { font-size: var(--font-size-sm); color: var(--text-muted); margin-top: 2px; }

    /* Chart cards */
    .chart-card {
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .chart-title { font-size: 10px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.03em; text-transform: uppercase; }
    .chart-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: var(--font-size-mono);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .chart-canvas { width: 100%; height: 140px; }
    .chart-canvas canvas { width: 100% !important; height: 140px !important; }

    /* ── Footer ── */
    .footer {
      padding: 1rem 0;
      border-top: 1px solid var(--glass-border);
      margin-top: 1.5rem;
    }
    .footer-inner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }
    @media (max-width: 639px) {
      .footer-inner { grid-template-columns: 1fr; text-align: center; }
    }
    .footer-brand {
      font-size: 13px; font-weight: 600;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .footer-uptime {
      font-size: var(--font-size-sm);
      color: var(--text-muted);
      text-align: center;
      font-family: var(--font-mono);
    }
    .footer-powered {
      font-size: var(--font-size-sm);
      color: var(--text-muted);
      text-align: right;
    }
    .footer-powered a:hover { color: var(--text-primary); }

    /* ── Back to Top ── */
    .back-to-top {
      position: fixed; z-index: 50;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--glass-strong);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      cursor: pointer;
      opacity: 0; visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s, transform 0.3s;
      transform: scale(0.85);
    }
    .back-to-top.visible {
      opacity: 1; visibility: visible;
      transform: scale(1);
    }
    .back-to-top:hover {
      color: var(--text-primary);
      border-color: rgba(16,185,129,0.3);
      transform: scale(1.1);
    }
    .back-to-top svg { width: 16px; height: 16px; }
    .back-to-top.visible:hover { transform: scale(1.1); }

    /* ── Scrollbar Styling ── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-deepest); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

    /* ── Selection ── */
    ::selection { background: rgba(16,185,129,0.25); color: var(--text-primary); }

    /* ── Responsive helpers ── */
    .hidden { display: none !important; }
  </style>
</head>

    <button class="back-to-top" id="back-to-top" aria-label="回到顶部" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <polyline points="18 15 12 9 6 15"/>
      </svg>
    </button>
  </div>

<script>
/* ══════════════════════════════════════════════════
   GalaxyGlass v2.0.0 — JavaScript
   ══════════════════════════════════════════════════ */

(function() {
  'use strict';

  // ── State ──
  var nodesList = [];
  var viewMode = localStorage.getItem('nodeViewMode') || 'grid';
  var sortMode = localStorage.getItem('nodeSort') || 'default';
  var filterRegion = null;
  var searchQuery = '';
  var siteStart = Date.now();
  var exchangeRate = 6.82;

  var SORT_OPTIONS = [
    { value: 'default', label: '默认' },
    { value: 'name',    label: '名称' },
    { value: 'region',  label: '地区' },
    { value: 'cpu',     label: 'CPU 占用' },
    { value: 'mem',     label: '内存占用' },
    { value: 'disk',    label: '磁盘占用' },
    { value: 'down',    label: '下行速度' },
    { value: 'up',      label: '上行速度' },
    { value: 'uptime',  label: '在线时长' }
  ];

  // ── Helpers ──
  function $(id) { return document.getElementById(id); }

  function bytes(v) {
    if (!v || v <= 0) return '0B';
    var u = ['B','KB','MB','GB','TB','PB'];
    var i = Math.min(Math.floor(Math.log(v) / Math.log(1024)), u.length - 1);
    return (v / Math.pow(1024, i)).toFixed(i < 2 ? 0 : 1) + u[i];
  }

  function getOSIcon(os) {
    if (!os) return '';
    os = os.toLowerCase();
    if (os.includes('alpine')) return 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text font-family="monospace" font-size="18" y="18" fill="%235e81f4">⛰</text></svg>';
    if (os.includes('debian')) return 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text font-family="monospace" font-size="18" y="18" fill="%23D70A53">♦</text></svg>';
    if (os.includes('ubuntu')) return 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text font-family="monospace" font-size="18" y="18" fill="%23E95420">☮</text></svg>';
    if (os.includes('centos') || os.includes('rhel')) return 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text font-family="monospace" font-size="16" y="17" fill="%239326ee">●</text></svg>';
    return '';
  }

  function uptime(s) {
    if (!s || s <= 0) return '—';
    var d = Math.floor(s / 86400);
    var h = Math.floor((s % 86400) / 3600);
    return (d > 0 ? d + '天 ' : '') + h + '时';
  }

  function age(t) {
    if (!t) return '—';
    var diff = Math.floor((Date.now() - new Date(t).getTime()) / 1000);
    if (diff < 60) return diff + '秒前';
    if (diff < 3600) return Math.floor(diff/60) + '分钟前';
    return Math.floor(diff/3600) + '小时前';
  }

  function metricClass(pct) {
    return pct >= 80 ? 'high' : pct >= 60 ? 'medium' : 'low';
  }

  function flagEmoji(region) {
    var m = { '🇺🇸':'us','🇯🇵':'jp','🇭🇰':'hk','🇳🇱':'nl','🇰🇵':'kp','🇩🇪':'de','🇸🇬':'sg','🇬🇧':'gb','🇰🇷':'kr','🇨🇳':'cn','🇷🇺':'ru','🇨🇦':'ca','🇦🇺':'au' };
    return m[region] || '';
  }

  function mergeNodeData(node, recent) {
    var r = recent && recent.length ? recent[0] : {};
    return Object.assign({}, node, {
      cpu_usage: (r.cpu && r.cpu.usage) || 0,
      mem_used: (r.ram && r.ram.used) || 0,
      disk_used: (r.disk && r.disk.used) || 0,
      net_up: (r.network && r.network.up) || 0,
      net_down: (r.network && r.network.down) || 0,
      total_up: (r.network && r.network.totalUp) || 0,
      total_down: (r.network && r.network.totalDown) || 0,
      uptime_sec: r.uptime || 0,
      load1: r.load && r.load.load1,
      load5: r.load && r.load.load5,
      load15: r.load && r.load.load15,
      connections: r.connections,
      process: r.process,
      online: !!r.updated_at,
      updated_at: r.updated_at || node.updated_at
    });
  }

  // ── Fetch ──
  async function fetchJSON(url) {
    try {
      var r = await fetch(url);
      return await r.json();
    } catch(e) {
      return null;
    }
  }

  async function loadData() {
    var siteData = await fetchJSON('/api/public');
    if (siteData && siteData.theme_settings) {
      var ts = siteData.theme_settings;
      $('poster').src = ts.posterUrl || 'https://img.357561.xyz/image-wallpaper2.png';
      $('bg-video').src = ts.videoUrl || '';
      if (ts.videoUrl) {
        $('bg-video').play().then(function() {
          $('bg-video').style.opacity = '1';
          $('poster').style.opacity = '0';
        }).catch(function(){});
      }
      if (ts.blurValue) {
        document.querySelectorAll('.node-card, .stat-card, .table-row, .metric-card, .sysinfo-card, .tags-card, .traffic-card, .chart-card').forEach(function(el) {
          el.style.backdropFilter = 'blur(' + ts.blurValue + 'px)';
          el.style.webkitBackdropFilter = 'blur(' + ts.blurValue + 'px)';
        });
      }
      if (ts.buildTime) {
        var parsed = new Date(ts.buildTime);
        if (!isNaN(parsed.getTime())) siteStart = parsed.getTime();
      }
      if (siteData.sitename) {
        document.querySelectorAll('#site-name, #footer-brand').forEach(function(el) { el.textContent = siteData.sitename; });
        document.title = siteData.sitename;
      }
    }

    // Fetch rate
    var rateData = await fetchJSON('https://v6.exchangerate-api.com/v6/4eb672eb050aa81c7d8ddca1/latest/USD');
    if (rateData && rateData.conversion_rates && rateData.conversion_rates.CNY) {
      exchangeRate = rateData.conversion_rates.CNY;
      $('stat-cost-rate').textContent = '@' + exchangeRate.toFixed(2);
    }

    // Fetch nodes
    var nodeData = await fetchJSON('/api/nodes');
    if (!nodeData || !nodeData.data) return;

    var raw = nodeData.data;
    var merged = await Promise.all(raw.map(async function(node) {
      var recent = await fetchJSON('/api/recent/' + node.uuid);
      return mergeNodeData(node, recent ? recent.data : []);
    }));

    nodesList = merged;
    render();
  }

  // ── Render ──
  function render() {
    var filtered = nodesList.filter(function(n) {
      if (filterRegion && n.region !== filterRegion) return false;
      if (searchQuery) {
        var q = searchQuery.toLowerCase();
        var name = (n.name || '').toLowerCase();
        var region = (n.region || '').toLowerCase();
        var tags = (n.tags || '').toLowerCase();
        var uuid = (n.uuid || '').toLowerCase();
        if (name.indexOf(q) === -1 && region.indexOf(q) === -1 && tags.indexOf(q) === -1 && uuid.indexOf(q) === -1) return false;
      }
      return true;
    });

    sortNodes(filtered);

    var showing = filtered.length;

    // Show/hide states
    var loading = $('loading');
    var empty = $('empty-state');
    var grid = $('grid-view');
    var table = $('table-view');

    if (nodesList.length === 0) {
      loading.classList.remove('hidden');
      empty.classList.add('hidden');
      grid.style.display = 'none';
      table.style.display = 'none';
      return;
    }

    loading.classList.add('hidden');

    if (showing === 0) {
      empty.classList.remove('hidden');
      grid.style.display = 'none';
      table.style.display = 'none';
    } else {
      empty.classList.add('hidden');
      if (viewMode === 'grid') {
        grid.style.display = '';
        table.style.display = 'none';
        grid.innerHTML = filtered.map(renderCard).join('');
      } else {
        grid.style.display = 'none';
        table.style.display = '';
        $('table-body').innerHTML = filtered.map(renderRow).join('');
      }
    }

    updateStats();
    buildRegionFilters();
    positionBackToTop();
  }

  // ── Sort ──
  function sortNodes(arr) {
    var fns = {
      default: function(a,b) { return (b.online ? 1 : 0) - (a.online ? 1 : 0) || (a.weight || 0) - (b.weight || 0); },
      name:    function(a,b) { return (a.name || '').localeCompare(b.name || ''); },
      region:  function(a,b) { return (a.region || '').localeCompare(b.region || ''); },
      cpu:     function(a,b) { return (b.cpu_usage || 0) - (a.cpu_usage || 0); },
      mem:     function(a,b) { return ((b.mem_used||0)/(b.mem_total||1) - (a.mem_used||0)/(a.mem_total||1)); },
      disk:    function(a,b) { return ((b.disk_used||0)/(b.disk_total||1) - (a.disk_used||0)/(a.disk_total||1)); },
      down:    function(a,b) { return (b.net_down || 0) - (a.net_down || 0); },
      up:      function(a,b) { return (b.net_up || 0) - (a.net_up || 0); },
      uptime:  function(a,b) { return (b.uptime_sec || 0) - (a.uptime_sec || 0); }
    };
    var fn = fns[sortMode] || fns.default;
    arr.sort(fn);
    var i = 0;
    arr.forEach(function(n) { n._animDelay = i++; });
  }

  // ── Card Template ──
  function renderCard(n) {
    var animDelay = (n._animDelay || 0) * 35;
    var osIcon = getOSIcon(n.os);
    var cpu = n.cpu_usage || 0;
    var memPct = n.mem_total > 0 ? ((n.mem_used || 0) / n.mem_total) * 100 : 0;
    var diskPct = n.disk_total > 0 ? ((n.disk_used || 0) / n.disk_total) * 100 : 0;
    var online = n.online;
    var flagCode = flagEmoji(n.region);

    return '<div class="node-card' + (online ? '' : ' offline') + '" data-uuid="' + n.uuid + '" tabindex="0" role="listitem" style="animation-delay:' + animDelay + 'ms">'
      + '<div class="node-card-header">'
        + '<div class="node-status ' + (online ? 'online' : 'offline') + '"></div>'
        + (osIcon ? '<img class="node-os-icon" src="' + osIcon + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '')
        + '<div class="node-name">' + (n.name || n.uuid || '—') + '</div>'
        + (n.region ? '<div class="node-region">' + (flagCode ? '<img class="node-flag" src="https://flagcdn.com/' + flagCode + '.svg" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '') + '</div>' : '')
      + '</div>'
      + '<div class="node-specs">' + [n.os, n.virtualization, n.cpu_name].filter(Boolean).join(' · ') + '</div>'
      + '<div class="metrics">'
        + metricRow('CPU', cpu.toFixed(1) + '%', cpu, 'low', 'medium', 'high')
        + metricRow('内存', memPct.toFixed(1) + '%', memPct, 'low', 'medium', 'high')
        + metricRow('磁盘', diskPct.toFixed(1) + '%', diskPct, 'low', 'medium', 'high')
      + '</div>'
      + '<div class="node-footer">'
        + '<span class="node-footer-item">🕐 ' + uptime(n.uptime_sec) + '</span>'
        + '<span class="node-footer-sep"></span>'
        + '<span class="node-footer-item">📊 ' + bytes((n.total_up||0)+(n.total_down||0)) + '</span>'
        + (n.price ? '<span class="price-badge">' + (n.currency||'¥') + n.price + '/' + (n.billing_cycle===365?'年':n.billing_cycle===30?'月':n.billing_cycle===1095?'3年':n.billing_cycle===0?'永久':'期') + '</span>' : '')
        + (n.expired_at ? '<span class="node-footer-item node-footer-expire">' + new Date(n.expired_at).toLocaleDateString('zh-CN') + '</span>' : '')
      + '</div>'
    + '</div>';
  }

  function metricRow(label, value, pct, cls1, cls2, cls3) {
    var cls = pct >= 80 ? cls3 : pct >= 60 ? cls2 : cls1;
    return '<div class="metric-row">'
      + '<div class="metric-header"><span class="metric-label">' + label + '</span><span class="metric-value">' + value + '</span></div>'
      + '<div class="metric-bar"><div class="metric-fill ' + cls + '" style="transform:scaleX(' + Math.min(1, pct/100) + ')"></div></div>'
    + '</div>';
  }

  // ── Table Row Template ──
  function renderRow(n) {
    var animDelay = (n._animDelay || 0) * 30;
    var osIcon = getOSIcon(n.os);
    var cpu = n.cpu_usage || 0;
    var memPct = n.mem_total > 0 ? ((n.mem_used || 0) / n.mem_total) * 100 : 0;
    var diskPct = n.disk_total > 0 ? ((n.disk_used || 0) / n.disk_total) * 100 : 0;
    var online = n.online;
    var flagCode = flagEmoji(n.region);
    var up = n.net_up || 0;
    var down = n.net_down || 0;

    return '<div class="table-row' + (online ? '' : ' offline') + '" data-uuid="' + n.uuid + '" tabindex="0" role="row" style="animation-delay:' + animDelay + 'ms">'
      + '<div class="row-title">'
        + '<div class="node-status ' + (online ? 'online' : 'offline') + '"></div>'
        + (osIcon ? '<img class="node-os-icon" src="' + osIcon + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '')
        + '<span class="name-text">' + (n.name || n.uuid || '—') + '</span>'
        + (flagCode ? '<img class="table-flag" src="https://flagcdn.com/' + flagCode + '.svg" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '')
      + '</div>'
      + '<div class="row-meters">'
        + '<div class="meter-row"><span class="meter-label">CPU</span><div class="meter-bar"><div class="meter-fill ' + (cpu>=80?'danger':cpu>=60?'warn':'ok') + '" style="transform:scaleX(' + Math.min(1,cpu/100) + ')"></div></div><span class="meter-value" style="color:' + (cpu>=80?'var(--danger)':cpu>=60?'var(--accent-orange)':'var(--accent)') + '">' + cpu.toFixed(1) + '%</span></div>'
        + '<div class="meter-row"><span class="meter-label">MEM</span><div class="meter-bar"><div class="meter-fill ' + (memPct>=80?'danger':memPct>=60?'warn':'ok') + '" style="transform:scaleX(' + Math.min(1,memPct/100) + ')"></div></div><span class="meter-value" style="color:' + (memPct>=80?'var(--danger)':memPct>=60?'var(--accent-orange)':'var(--accent)') + '">' + memPct.toFixed(1) + '%</span></div>'
        + '<div class="meter-row"><span class="meter-label">DSK</span><div class="meter-bar"><div class="meter-fill ' + (diskPct>=80?'danger':diskPct>=60?'warn':'ok') + '" style="transform:scaleX(' + Math.min(1,diskPct/100) + ')"></div></div><span class="meter-value" style="color:' + (diskPct>=80?'var(--danger)':diskPct>=60?'var(--accent-orange)':'var(--accent)') + '">' + diskPct.toFixed(1) + '%</span></div>'
      + '</div>'
      + '<div class="row-footer">'
        + '↓' + bytes(down) + '/s · ↑' + bytes(up) + '/s'
        + ' · 🕐' + uptime(n.uptime_sec)
        + (n.price ? ' · <span style="font-weight:600;color:var(--accent)">' + (n.currency||'¥') + n.price + '</span>' : '')
      + '</div>'
    + '</div>';
  }

  // ── Stats ──
  function updateStats() {
    var online = 0, totalTrafficUp = 0, totalTrafficDown = 0;
    var monthlyCost = 0, residualValue = 0;
    var regionSet = {};

    nodesList.forEach(function(n) {
      if (n.online) {
        online++;
        if (n.region) regionSet[n.region] = true;
      }
      totalTrafficUp += n.total_up || 0;
      totalTrafficDown += n.total_down || 0;

      // Financial
      if (n.price && n.billing_cycle > 0) {
        if (n.billing_cycle === 30) {
          monthlyCost += n.price;
        } else if (n.billing_cycle === 365) {
          monthlyCost += n.price / 12;
        } else if (n.billing_cycle === 1095) {
          monthlyCost += n.price / 36;
        }
      }

      if (n.expired_at && n.price && n.billing_cycle > 0) {
        var remain = Math.max(0, (new Date(n.expired_at).getTime() - Date.now()) / 86400000);
        var total = n.billing_cycle;
        residualValue += n.price * remain / total;
      } else if (n.billing_cycle === 0 && n.price) {
        residualValue += n.price;
      }
    });

    var total = nodesList.length;

    $('stat-online-value').textContent = online + '/' + total;
    $('stat-region-value').textContent = '点亮区域 ' + Object.keys(regionSet).length;

    // Traffic
    $('stat-traffic-up').textContent = '↑ ' + bytes(totalTrafficUp);
    $('stat-traffic-down').textContent = '↓ ' + bytes(totalTrafficDown);

    // Rate
    var rateUp = 0, rateDown = 0;
    nodesList.forEach(function(n) {
      rateUp += n.net_up || 0;
      rateDown += n.net_down || 0;
    });
    $('stat-traffic-rate').innerHTML = '<span>⚡↑ ' + bytes(rateUp) + '/s</span> · <span>⚡↓ ' + bytes(rateDown) + '/s</span>';

    // Cost
    var totalCost = 0, totalResidual = 0;
    nodesList.forEach(function(n) {
      if (n.price && n.billing_cycle > 0) {
        var rate = n.currency === '$' ? exchangeRate : 1;
        var p = n.price * rate;
        if (n.billing_cycle === 30) totalCost += p;
        else if (n.billing_cycle === 365) totalCost += p / 12;
        else if (n.billing_cycle === 1095) totalCost += p / 36;

        if (n.expired_at) {
          var remain = Math.max(0, (new Date(n.expired_at).getTime() - Date.now()) / 86400000);
          totalResidual += p * remain / n.billing_cycle;
        }
      }
    });

    $('stat-cost-monthly').textContent = '¥' + Math.round(totalCost);
    $('stat-cost-usd').textContent = '≈ $' + (totalCost / exchangeRate).toFixed(2);
  }

  // ── Region Filters ──
  function buildRegionFilters() {
    var regionMap = {};
    nodesList.forEach(function(n) {
      if (n.region) regionMap[n.region] = (regionMap[n.region] || 0) + 1;
    });
    var regions = Object.keys(regionMap).sort(function(a,b) { return regionMap[b] - regionMap[a]; });

    var container = $('region-filters');
    if (regions.length === 0) {
      container.innerHTML = '';
      return;
    }

    var html = '<div class="filters">';
    html += '<button class="chip' + (filterRegion === null ? ' active' : '') + '" data-region="">全部 <span class="count">' + nodesList.length + '</span></button>';
    regions.forEach(function(r) {
      var code = flagEmoji(r);
      var flagImg = code ? '<img src="https://flagcdn.com/' + code + '.svg" alt="" style="width:18px;height:13px;object-fit:cover;border-radius:2px;" loading="lazy" onerror="this.style.display=\'none\'">' : '';
      html += '<button class="chip' + (filterRegion === r ? ' active' : '') + '" data-region="' + r + '">' + flagImg + r + ' <span class="count">' + regionMap[r] + '</span></button>';
    });
    html += '</div>';
    container.innerHTML = html;

    container.querySelectorAll('.chip').forEach(function(btn) {
      btn.addEventListener('click', function() {
        filterRegion = this.dataset.region || null;
        render();
      });
    });
  }

  // ── Back to Top Position ──
  function positionBackToTop() {
    var grid = $('grid-view');
    var btn = $('back-to-top');
    if (!grid || !btn || grid.style.display === 'none') return;
    var cards = grid.querySelectorAll('.node-card');
    if (cards.length === 0) return;
    var last = cards[cards.length - 1];
    var lastRect = last.getBoundingClientRect();
    var gridRect = grid.getBoundingClientRect();
    var cardBottomPageY = lastRect.bottom + window.scrollY;
    var distToPageBottom = document.documentElement.scrollHeight - cardBottomPageY;
    btn.style.bottom = Math.max(4, distToPageBottom) + 'px';
    btn.style.top = 'auto';
    btn.style.right = Math.max(4, (window.innerWidth - gridRect.right + 16) / 3) + 'px';
  }

  // ── Detail View ──
  function showDetailView(uuid) {
    var detail = $('detail-view');
    var list = $('list-view');
    if (!detail || !list) return;
    detail.classList.remove('hidden');
    list.classList.add('hidden');
    window.scrollTo(0, 0);
    loadDetailData(uuid);
  }

  function showListView() {
    window.removeEventListener('resize', redrawDetailCharts);
    window._detailChartData = null;
    $('detail-view').classList.add('hidden');
    $('list-view').classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  function loadDetailData(uuid) {
    var loading = $('detail-loading');
    var error = $('detail-error');
    var content = $('detail-content');
    loading.classList.remove('hidden');
    error.classList.add('hidden');
    content.classList.add('hidden');

    var node = nodesList.find(function(n) { return n.uuid === uuid; });
    var nodeP = node ? Promise.resolve(node) : fetchJSON('/api/nodes').then(function(d) { return (d.data || []).find(function(n) { return n.uuid === uuid; }); });

    nodeP.then(function(n) {
      if (!n) {
        loading.classList.add('hidden');
        error.textContent = '未找到该节点';
        error.classList.remove('hidden');
        return;
      }
      fetchJSON('/api/recent/' + uuid).then(function(recentData) {
        var recent = recentData ? recentData.data || [] : [];
        var merged = mergeNodeData(n, recent);
        renderDetailView(merged, recent);
      });
    }).catch(function(err) {
      loading.classList.add('hidden');
      error.textContent = '加载失败: ' + err.message;
      error.classList.remove('hidden');
    });
  }

  function renderDetailView(node, recent) {
    var latest = recent[0] || {};
    var pts = recent.slice().reverse();

    $('detail-name').textContent = node.name || node.uuid;
    var flagCode = flagEmoji(node.region);
    var flagImg = flagCode ? '<img class="detail-flag" src="https://flagcdn.com/' + flagCode + '.svg" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '';
    var osIcon = getOSIcon(node.os);
    var osImg = osIcon ? '<img src="' + osIcon + '" alt="" style="width:14px;height:14px;border-radius:2px;flex-shrink:0;" loading="lazy" onerror="this.style.display=\'none\'">' : '';
    $('detail-meta').innerHTML = flagImg + osImg + ' ' + [node.region, node.virtualization, (node.os||'').split(' ')[0]].filter(Boolean).join(' · ');

    // Metrics
    var cpu = latest.cpu && latest.cpu.usage || 0;
    var memPct = node.mem_total > 0 ? ((latest.ram && latest.ram.used || 0) / node.mem_total) * 100 : 0;
    var diskPct = node.disk_total > 0 ? ((latest.disk && latest.disk.used || 0) / node.disk_total) * 100 : 0;
    var memUsed = latest.ram && latest.ram.used || 0;
    var diskUsed = latest.disk && latest.disk.used || 0;
    var netUp = latest.network && latest.network.up || 0;
    var netDown = latest.network && latest.network.down || 0;
    var totalUp = latest.network && latest.network.totalUp || 0;
    var totalDown = latest.network && latest.network.totalDown || 0;
    var trafficUsed = totalUp + totalDown;
    var trafficLimit = node.traffic_limit || 0;

    $('detail-metrics').innerHTML = [
      { label: 'CPU', value: cpu.toFixed(1) + '%', pct: cpu, sub: '' },
      { label: '内存', value: memPct.toFixed(1) + '%', pct: memPct, sub: bytes(memUsed) + ' / ' + bytes(node.mem_total) },
      { label: '磁盘', value: diskPct.toFixed(1) + '%', pct: diskPct, sub: bytes(diskUsed) + ' / ' + bytes(node.disk_total) },
      { label: '在线', value: uptime(latest.uptime), pct: undefined, sub: '' },
      { label: '网络', value: '↑' + bytes(netUp) + '/s ↓' + bytes(netDown) + '/s', pct: undefined, sub: '' },
      { label: '流量', value: bytes(trafficUsed) + (trafficLimit > 0 ? ' / ' + bytes(trafficLimit) : ''), pct: undefined, sub: '' }
    ].map(function(m) {
      return '<div class="metric-card">'
        + '<span class="metric-label">' + m.label + '</span>'
        + '<span class="metric-value" style="font-size:15px;font-weight:700;display:block;margin-top:2px;">' + m.value + '</span>'
        + (m.sub ? '<span class="metric-sub">' + m.sub + '</span>' : '')
        + (m.pct !== undefined ? '<div class="metric-bar" style="margin-top:4px"><div class="metric-fill ' + metricClass(m.pct) + '" style="transform:scaleX(' + Math.min(1, m.pct/100) + ')"></div></div>' : '')
      + '</div>';
    }).join('');

    // Sysinfo
    var load1 = latest.load && latest.load.load1 || latest.load1;
    var load5 = latest.load && latest.load.load5 || latest.load5;
    var load15 = latest.load && latest.load.load15 || latest.load15;
    var cores = node.cpu_cores || 1;

    function loadCls(v) { return v >= cores * 2 ? 'high' : v >= cores * 1 ? 'medium' : 'low'; }

    var leftRows = [
      {lbl:'CPU 型号', val: node.cpu_name || '-'},
      {lbl:'核心数', val: node.cpu_cores ? '× ' + node.cpu_cores : '-'},
      {lbl:'架构', val: node.arch || '-'},
      {lbl:'虚拟化', val: node.virtualization || '-'},
      {lbl:'操作系统', val: (node.os||'-').split(' ').slice(0,2).join(' ')},
      {lbl:'GPU', val: (node.gpu_name && node.gpu_name !== 'None') ? node.gpu_name : '-'},
      {lbl:'内存', val: bytes(node.mem_total)},
      {lbl:'Swap', val: (node.swap_total||0) > 0 ? bytes(node.swap_total) : '无'},
      {lbl:'磁盘', val: bytes(node.disk_total)}
    ];
    var rightRows = [
      {lbl:'流量限额', val: trafficLimit > 0 ? bytes(trafficLimit) : '无'},
      {lbl:'进程数', val: latest.process || '-'},
      {lbl:'TCP 连接', val: (latest.connections && latest.connections.tcp) || '-'},
      {lbl:'最后更新', val: age(latest.updated_at)},
      {lbl:'在线时长', val: uptime(latest.uptime)},
      {lbl:'到期', val: node.expired_at ? new Date(node.expired_at).toLocaleDateString('zh-CN') : '-'}
    ];

    if (load1 !== null) {
      rightRows.splice(rightRows.findIndex(function(r) { return r.lbl === '在线时长'; }) + 1, 0, {
        lbl:'负载均值', isLoad: true, v1: load1, v5: load5, v15: load15, cores: cores
      });
    }

    function renderRow(r) {
      if (r.isLoad) {
        return '<div class="sysinfo-row"><span class="lbl">' + r.lbl + '</span><div class="load-row"><span class="load-badge ' + loadCls(r.v1) + '">1m ' + r.v1 + '</span><span class="load-badge ' + loadCls(r.v5) + '">5m ' + r.v5 + '</span><span class="load-badge ' + loadCls(r.v15) + '">15m ' + r.v15 + '</span></div></div>';
      }
      return '<div class="sysinfo-row"><span class="lbl">' + r.lbl + '</span><span class="val">' + r.val + '</span></div>';
    }

    var trafficPct = trafficLimit > 0 ? (trafficUsed / trafficLimit) * 100 : 0;
    var priceStr = node.price ? (node.currency||'¥') + node.price + '/' + (node.billing_cycle===365?'年':node.billing_cycle===30?'月':node.billing_cycle===1095?'3年':node.billing_cycle===0?'永久':'期') : '无';
    var daysLeft = node.expired_at ? Math.max(0, Math.ceil((new Date(node.expired_at).getTime()-Date.now())/86400000)) : null;

    $('detail-sysinfo').innerHTML = '<div class="sysinfo-grid"><div>' + leftRows.map(renderRow).join('') + '</div><div>' + rightRows.map(renderRow).join('') + '</div><div class="sysinfo-bill"><span class="bill-chip">' + priceStr + '</span><span class="bill-chip' + (trafficPct>=80?' danger':'') + '">📊 ' + bytes(trafficUsed) + '/' + bytes(trafficLimit) + '</span><span class="bill-chip' + (daysLeft !== null && daysLeft < 15 ? ' danger' : '') + '">📅 ' + (daysLeft !== null ? daysLeft + '天' : '永久') + '</span></div></div>';

    // Tags
    var tags = node.tags ? String(node.tags).split(',').filter(function(t) { return t.trim(); }) : [];
    var tcp = (latest.connections && latest.connections.tcp) || 0;
    var udp = (latest.connections && latest.connections.udp) || 0;
    var tagEl = $('detail-tags');
    if (tags.length === 0 && !tcp && !udp) {
      tagEl.classList.add('hidden');
    } else {
      tagEl.classList.remove('hidden');
      var tagColors = ['','-alt','-warm',''];
      var tagHtml = tags.length ? '<div class="tags-list">' + tags.map(function(t,i) { return '<span class="tag-chip' + tagColors[i%4] + '">' + t.trim() + '</span>'; }).join('') + '</div>' : '';
      var connHtml = (tcp || udp) ? '<div class="conn-row"><span class="conn-item">🔌 <strong>' + tcp + '</strong> TCP</span><span class="conn-item">🔌 <strong>' + udp + '</strong> UDP</span></div>' : '';
      tagEl.innerHTML = '<div class="tags-title">标签 · 连接</div>' + tagHtml + connHtml;
    }

    // Traffic detail
    $('detail-traffic').innerHTML = '<div class="traffic-title">流量统计</div>'
      + '<div class="traffic-row"><span class="dir up">↑</span>上传 ' + bytes(totalUp) + '</div>'
      + '<div class="traffic-row"><span class="dir down">↓</span>下载 ' + bytes(totalDown) + '</div>'
      + '<div class="traffic-bar-wrap"><div class="traffic-bar-bg"><div class="traffic-bar-fill ' + (trafficPct>=80?'danger':trafficPct>=60?'warn':'') + '" style="transform:scaleX(' + Math.min(1, trafficPct/100) + ')"></div></div></div>'
      + '<div class="traffic-summary">已用 ' + bytes(trafficUsed) + (trafficLimit > 0 ? ' / ' + bytes(trafficLimit) + ' (' + trafficPct.toFixed(1) + '%)' : '') + '</div>';

    // Badges
    $('badge-cpu').textContent = cpu.toFixed(1) + '%';
    $('badge-mem').textContent = memPct.toFixed(1) + '%';
    $('badge-net').textContent = '↑ ' + bytes(netUp) + '/s · ↓ ' + bytes(netDown) + '/s';

    // Show
    $('detail-loading').classList.add('hidden');
    $('detail-content').classList.remove('hidden');

    // Charts
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        var cpuPts = pts.map(function(r) { return (r.cpu && r.cpu.usage) || 0; });
        var memPts = pts.map(function(r) {
          var total = (r.ram && r.ram.total) || node.mem_total || 1;
          var used = (r.ram && r.ram.used) || 0;
          return total > 0 ? (used / total) * 100 : 0;
        });
        var upPts = pts.map(function(r) { return (r.network && r.network.up) || 0; });
        var downPts = pts.map(function(r) { return (r.network && r.network.down) || 0; });

        drawLineChart('chart-cpu', cpuPts, '#10b981', 'rgba(16,185,129,0.12)');
        drawLineChart('chart-mem', memPts, '#6366f1', 'rgba(99,102,241,0.12)');
        drawNetChart('chart-net', upPts, downPts, pts);

        window._detailChartData = { cpuPts: cpuPts, memPts: memPts, upPts: upPts, downPts: downPts, pts: pts };
        window.addEventListener('resize', redrawDetailCharts);
      });
    });
  }

  function redrawDetailCharts() {
    var d = window._detailChartData;
    if (!d) return;
    drawLineChart('chart-cpu', d.cpuPts, '#10b981', 'rgba(16,185,129,0.12)');
    drawLineChart('chart-mem', d.memPts, '#6366f1', 'rgba(99,102,241,0.12)');
    drawNetChart('chart-net', d.upPts, d.downPts, d.pts);
  }

  // ── Charts ──
  function getCanvasCtx(id) {
    var canvas = document.getElementById(id);
    if (!canvas) return null;
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.offsetWidth;
    var h = parseInt(canvas.style.height) || 140;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);
    return { ctx: ctx, w: w, h: h };
  }

  function drawLineChart(id, points, color, bgColor) {
    var c = getCanvasCtx(id);
    if (!c) return;
    var ctx = c.ctx, w = c.w, h = c.h;

    ctx.clearRect(0, 0, w, h);

    if (!points || points.length < 2) {
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('数据不足', w/2, h/2 + 4);
      return;
    }

    var min = Math.min.apply(null, points);
    var max = Math.max.apply(null, points);
    var range = max - min || 1;
    var stepX = w / (points.length - 1);
    var padY = 12;
    var chartH = h - padY * 2;

    // Grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    [0.25, 0.5, 0.75].forEach(function(ratio) {
      var y = padY + (1 - ratio) * chartH + 0.5;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    });

    // Build points
    var linePts = points.map(function(v, i) {
      return { x: i * stepX, y: padY + (1 - (v - min) / range) * chartH };
    });

    // Gradient fill
    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, bgColor);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    linePts.forEach(function(p, i) { i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); });
    ctx.lineTo(linePts[linePts.length-1].x, h);
    ctx.lineTo(0, h);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Line
    ctx.shadowColor = color;
    ctx.shadowBlur = 4;
    ctx.beginPath();
    linePts.forEach(function(p, i) { i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); });
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Endpoint dot
    var lastPt = linePts[linePts.length - 1];
    ctx.beginPath();
    ctx.arc(lastPt.x, lastPt.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(lastPt.x, lastPt.y, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }

  function drawNetChart(id, upPoints, downPoints, pts) {
    var c = getCanvasCtx(id);
    if (!c) return;
    var ctx = c.ctx, w = c.w, h = c.h;

    ctx.clearRect(0, 0, w, h);

    var len = Math.min(upPoints.length, downPoints.length);
    if (len < 2) {
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('数据不足', w/2, h/2 + 4);
      return;
    }

    var all = [];
    for (var i = 0; i < len; i++) { all.push(upPoints[i]); all.push(downPoints[i]); }
    var maxV = Math.max.apply(null, all) || 1;
    var padY = 12;
    var chartH = h - padY * 2;
    var stepX = w / (len - 1);

    // Labels
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(bytes(maxV) + '/s', 4, 10);
    ctx.textAlign = 'left';
    if (pts[0]) ctx.fillText(new Date(pts[0].updated_at).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}), 4, h - 2);
    ctx.textAlign = 'right';
    if (pts[len-1]) ctx.fillText(new Date(pts[len-1].updated_at).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}), w - 4, h - 2);

    // Legend
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(w - 60, 4, 16, 2);
    ctx.fillText('↑ 上行', w - 6, 10);
    ctx.fillStyle = '#10b981';
    ctx.fillRect(w - 60, 16, 16, 2);
    ctx.fillText('↓ 下行', w - 6, 22);

    function drawLine(ptValues, color) {
      var linePts = ptValues.slice(0, len).map(function(v, i) {
        return { x: i * stepX, y: padY + (1 - v / maxV) * chartH };
      });
      var grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, color.replace(')', ',0.15)').replace('rgb', 'rgba'));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath();
      linePts.forEach(function(p, i) { i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); });
      ctx.lineTo(linePts[linePts.length-1].x, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.shadowColor = color;
      ctx.shadowBlur = 4;
      ctx.beginPath();
      linePts.forEach(function(p, i) { i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); });
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.shadowBlur = 0;
      // End dot
      var last = linePts[linePts.length-1];
      ctx.beginPath(); ctx.arc(last.x, last.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();
      ctx.beginPath(); ctx.arc(last.x, last.y, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff'; ctx.fill();
    }

    drawLine(upPoints, '#f59e0b');
    drawLine(downPoints, '#10b981');
  }

  // ── Events ──
  function setupEvents() {
    // Search
    var searchBox = $('search-box');
    var searchInput = $('search-input');
    searchBox.addEventListener('click', function(e) {
      e.stopPropagation();
      searchBox.classList.add('open');
      setTimeout(function() { searchInput.focus(); }, 200);
    });
    document.addEventListener('click', function(e) {
      if (!searchBox.contains(e.target)) {
        searchBox.classList.remove('open');
        searchInput.blur();
      }
    });
    searchInput.addEventListener('input', function() {
      searchQuery = this.value;
      render();
    });

    // Mobile search
    $('mobile-search-btn').addEventListener('click', function(e) {
      e.stopPropagation();
      var mobile = $('mobile-search');
      mobile.classList.toggle('hidden');
      if (!mobile.classList.contains('hidden')) {
        setTimeout(function() { $('search-input-mobile').focus(); }, 100);
      } else {
        searchQuery = '';
        searchInput.value = '';
        $('search-input-mobile').value = '';
        render();
      }
    });
    $('search-input-mobile').addEventListener('input', function() {
      searchQuery = this.value;
      searchInput.value = this.value;
      render();
    });

    // View toggle
    $('view-cards').addEventListener('click', function() {
      viewMode = 'grid';
      localStorage.setItem('nodeViewMode', viewMode);
      updateViewToggle();
      render();
    });
    $('view-table').addEventListener('click', function() {
      viewMode = 'table';
      localStorage.setItem('nodeViewMode', viewMode);
      updateViewToggle();
      render();
    });

    // Sort
    var sortBtn = $('sort-btn');
    var sortMenu = $('sort-menu');
    sortBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      sortMenu.classList.toggle('hidden');
    });
    document.addEventListener('click', function() {
      sortMenu.classList.add('hidden');
    });
    sortMenu.querySelectorAll('.dropdown-item').forEach(function(item) {
      item.addEventListener('click', function() {
        sortMode = this.dataset.sort;
        localStorage.setItem('nodeSort', sortMode);
        updateSortUI();
        render();
        sortMenu.classList.add('hidden');
      });
    });

    // Card/Row click → detail
    $('grid-view').addEventListener('click', function(e) {
      var card = e.target.closest('.node-card');
      if (!card) return;
      var uuid = card.dataset.uuid;
      if (uuid) {
        history.pushState({ uuid: uuid }, '', '/instance/' + encodeURIComponent(uuid));
        showDetailView(uuid);
      }
    });
    $('table-body').addEventListener('click', function(e) {
      var row = e.target.closest('.table-row');
      if (!row) return;
      var uuid = row.dataset.uuid;
      if (uuid) {
        history.pushState({ uuid: uuid }, '', '/instance/' + encodeURIComponent(uuid));
        showDetailView(uuid);
      }
    });

    // Keyboard nav for cards/rows
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        var target = e.target.closest('[data-uuid]');
        if (target) {
          e.preventDefault();
          var uuid = target.dataset.uuid;
          history.pushState({ uuid: uuid }, '', '/instance/' + encodeURIComponent(uuid));
          showDetailView(uuid);
        }
      }
    });

    // Back to top
    $('back-to-top').addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Detail back
    $('detail-back').addEventListener('click', function() {
      history.pushState(null, '', '/');
      showListView();
    });

    // Init UI
    updateViewToggle();
    updateSortUI();
  }

  function updateViewToggle() {
    var slider = $('view-slider');
    var cards = $('view-cards');
    var table = $('view-table');
    if (viewMode === 'table') {
      slider.classList.add('table');
      cards.setAttribute('aria-selected', 'false');
      cards.classList.remove('active');
      table.setAttribute('aria-selected', 'true');
      table.classList.add('active');
    } else {
      slider.classList.remove('table');
      cards.setAttribute('aria-selected', 'true');
      cards.classList.add('active');
      table.setAttribute('aria-selected', 'false');
      table.classList.remove('active');
    }
  }

  function updateSortUI() {
    var opt = SORT_OPTIONS.find(function(o) { return o.value === sortMode; });
    $('sort-label').textContent = opt ? opt.label : '默认';
    $('sort-menu').querySelectorAll('.dropdown-item').forEach(function(item) {
      item.classList.toggle('active', item.dataset.sort === sortMode);
    });
  }

  // ── Scroll ──
  function setupScroll() {
    var navbar = $('navbar');
    var backToTop = $('back-to-top');
    var isScrolled = false;
    var ticking = false;

    window.addEventListener('scroll', function() {
      if (!ticking) {
        window.requestAnimationFrame(function() {
          var y = window.scrollY || document.documentElement.scrollTop;
          if (y > 25 && !isScrolled) {
            isScrolled = true;
            navbar.classList.add('scrolled');
            backToTop.classList.add('visible');
          } else if (y <= 25 && isScrolled) {
            isScrolled = false;
            navbar.classList.remove('scrolled');
            backToTop.classList.remove('visible');
          }
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: true });

    // Detail nav scroll
    var detailNav = $('detail-nav');
    var detailTimer = null;
    window.addEventListener('scroll', function() {
      if (!detailNav) return;
      clearTimeout(detailTimer);
      detailTimer = setTimeout(function() {
        detailNav.classList.toggle('scrolled', window.scrollY > 10);
      }, 50);
    }, { passive: true });
  }

  // ── Router ──
  function setupRouter() {
    window.addEventListener('popstate', function(e) {
      var path = window.location.pathname;
      var match = path.match(/^\/instance\/(.+)$/);
      if (match && match[1]) {
        showDetailView(decodeURIComponent(match[1]));
      } else {
        showListView();
      }
    });

    // Initial path check
    var path = window.location.pathname;
    var match = path.match(/^\/instance\/(.+)$/);
    if (match && match[1]) {
      showDetailView(decodeURIComponent(match[1]));
    }
  }

  // ── Footer uptime ──
  function startFooterUptime() {
    updateFooterUptime();
    setInterval(updateFooterUptime, 60000);
  }

  function updateFooterUptime() {
    var diff = Math.floor((Date.now() - siteStart) / 1000);
    var d = Math.floor(diff / 86400);
    var h = Math.floor((diff % 86400) / 3600);
    var m = Math.floor((diff % 3600) / 60);
    var el = $('footer-uptime');
    if (el) el.textContent = '🛰️ 本站已稳定运行 ' + d + ' 日 ' + h + ' 时 ' + m + ' 分 🌌';
  }

  // ── Time (seconds) ──
  function startClock() {
    function tick() {
      var el = $('stat-time-value');
      if (el) el.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    }
    tick();
    setInterval(tick, 1000);
  }

  // ════════════════════════════════════════
  // Init
  // ════════════════════════════════════════
  setupEvents();
  setupScroll();
  loadData().then(function() {
    // Background video
    var video = $('bg-video');
    if (video.src) {
      video.play().then(function() {
        video.style.opacity = '1';
        $('poster').style.opacity = '0';
      }).catch(function(){});
    }
  });

  startClock();
  startFooterUptime();
  setupRouter();
})();
</script>
