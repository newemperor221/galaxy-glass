<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>节点详情</title>
  <style>
    :root {
      --accent: #10b981;
      --accent-orange: #f97316;
      --accent-purple: #a855f7;
      --danger: #ef4444;
      --text-primary: #fff;
      --text-secondary: rgba(255,255,255,0.7);
      --text-muted: rgba(255,255,255,0.35);
      --radius: 16px;
      --font-mono: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 14px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica', Arial, sans-serif;
      background: #0a1a0f;
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }

    .bg-layer {
      position: fixed; inset: 0; z-index: -1;
      background: #0a1a0f;
    }
    .bg-layer img, .bg-layer video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .page { min-height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 10; }
    .container { max-width: 1124px; margin: 0 auto; padding: 0 1.5rem; width: 100%; }

    /* ── 顶部导航 ── */
    .detail-nav {
      position: sticky; top: 0; z-index: 20;
      background: transparent;
      border-bottom: 1px solid transparent;
      padding: 0;
      transition: background 0.3s, border-color 0.3s, backdrop-filter 0.3s;
    }
    .detail-nav.scrolled {
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .detail-nav-inner {
      display: flex; align-items: center; gap: 12px;
      padding: 0.75rem 0;
    }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 9999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
      font-size: 13px; cursor: pointer;
      transition: all 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .back-btn svg { width: 14px; height: 14px; }
    .detail-title {
      font-size: 15px; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .detail-subtitle {
      font-size: 12px; color: var(--text-muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── 主内容 ── */
    .main { padding: 1.5rem 0 3rem; }

    /* ── 左右分栏布局 ── */
    .detail-body {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .detail-body { grid-template-columns: 1fr; }
    }

    /* ── 左侧 ── */
    .detail-left {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── 指标卡 ── */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 900px) { .metrics-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 480px) { .metrics-grid { grid-template-columns: 1fr 1fr; } }
    .metric-card {
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .metric-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: rgba(255,255,255,0.4);
    }
    .metric-value {
      font-size: 20px;
      font-weight: 700;
      font-family: var(--font-mono);
      line-height: 1;
    }
    .metric-bar {
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .metric-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s;
    }
    .metric-fill.low { background: var(--accent); }
    .metric-fill.medium { background: var(--accent-orange); }
    .metric-fill.high { background: var(--danger); }

    /* ── 系统信息 ── */
    .sysinfo-card {
      border-radius: var(--radius);
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 16px 18px;
    }
    .sysinfo-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 14px;
      position: relative;
    }
    .sysinfo-row::before {
      content: '';
      position: absolute; bottom: 0; left: 14px; right: 14px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05) 10%, rgba(255,255,255,0.05) 90%, transparent);
      pointer-events: none;
    }
    .sysinfo-row:last-child::before { display: none; }
    .sysinfo-row .lbl {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
    }
    .sysinfo-row .val {
      font-size: 12px;
      font-family: var(--font-mono);
      color: rgba(255,255,255,0.8);
      text-align: right;
      max-width: 60%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sysinfo-row .val.accent { color: var(--accent); }
    .sysinfo-row .val.orange { color: var(--accent-orange); }

    /* ── 负载信息行 ── */
    .load-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .load-badge {
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
    }

    /* ── 右侧图表 ── */
    .detail-right {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .chart-card {
      border-radius: var(--radius);
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 18px 20px;
      overflow: hidden;
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .chart-title {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .chart-badge {
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 2px 10px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
    }
    canvas { width: 100% !important; display: block; }

    /* ── 加载/空状态 ── */
    .loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4rem 0; color: rgba(255,255,255,0.3); }
    .loading-spinner { width: 28px; height: 28px; border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    .error-state { text-align: center; padding: 4rem 0; color: var(--danger); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="bg-layer">
  <img id="poster" alt="" style="opacity:0; transition: opacity 0.5s;">
  <video id="bg-video" autoplay="" loop="" muted="" playsinline="" style="opacity: 0; transition: opacity 0.5s;"></video>
</div>

<div class="page">
  <nav class="detail-nav">
    <div class="container detail-nav-inner">
      <button class="back-btn" id="back-btn" type="button">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        返回
      </button>
      <div style="flex:1;min-width:0;">
        <div class="detail-title" id="node-name">加载中…</div>
        <div class="detail-subtitle" id="node-meta"></div>
      </div>
    </div>
  </nav>

  <main class="container main">
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <span>加载节点数据…</span>
    </div>

    <div class="error-state hidden" id="error-state"></div>

    <div class="hidden" id="detail-content">

      <div class="detail-body">

        <div class="detail-left">
          <div class="metrics-grid" id="metrics-grid"></div>
          <div class="sysinfo-card" id="sysinfo-card"></div>
        </div>

        <div class="detail-right">
          <div class="chart-card">
            <div class="chart-header">
              <span class="chart-title">CPU 占用率</span>
              <span class="chart-badge" id="badge-cpu">—</span>
            </div>
            <canvas id="chart-cpu" height="160"></canvas>
          </div>
          <div class="chart-card">
            <div class="chart-header">
              <span class="chart-title">内存占用率</span>
              <span class="chart-badge" id="badge-mem">—</span>
            </div>
            <canvas id="chart-mem" height="160"></canvas>
          </div>
          <div class="chart-card">
            <div class="chart-header">
              <span class="chart-title">网络速率</span>
              <span class="chart-badge" id="badge-net">—</span>
            </div>
            <canvas id="chart-net" height="160"></canvas>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<script>
function bytes(b) {
  if (!b || b === 0) return '0 B';
  const k = 1024, sizes = ['B','KB','MB','GB','TB','PB'];
  const i = Math.floor(Math.log(b) / Math.log(k));
  return parseFloat((b / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}
function uptime(s) {
  if (!s || s < 0) return '-';
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d > 0) return d + '天' + h + '时';
  if (h > 0) return h + '时' + m + '分';
  return m + '分';
}
function age(ts) {
  if (!ts) return '-';
  const diff = Date.now() - new Date(ts).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + '分钟前';
  const h = Math.floor(mins / 60);
  if (h < 24) return h + '小时前';
  return Math.floor(h / 24) + '天前';
}
function metricClass(v) {
  if (v >= 90) return 'high';
  if (v >= 70) return 'medium';
  return 'low';
}
function pct(v, decimals=1) { return v.toFixed(decimals) + '%'; }
function loadClass(v) {
  // load > cpu_cores * 2 则高负载，> cpu_cores * 1 则中
  if (v >= 4) return 'high';
  if (v >= 2) return 'medium';
  return 'low';
}
function getUuid() {
  const params = new URLSearchParams(window.location.search);
  return params.get('uuid');
}

async function fetchPublicInfo() {
  try {
    const res = await fetch('/api/public');
    const data = await res.json();
    return data.data || {};
  } catch { return {}; }
}
async function fetchNodeInfo(uuid) {
  const res = await fetch('/api/nodes');
  const data = await res.json();
  return (data.data || []).find(n => n.uuid === uuid);
}
async function fetchRecentData(uuid) {
  const res = await fetch(`/api/recent/${uuid}`);
  const data = await res.json();
  return data.data || [];
}

function drawLine(canvasId, points, color, bgColor) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.offsetWidth;
  const h = 160;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);

  ctx.clearRect(0, 0, w, h);

  if (!points || points.length < 2) {
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('数据不足', w / 2, h / 2 + 4);
    return;
  }

  const min = Math.min(...points);
  const max = Math.max(...points);
  const range = max - min || 1;
  const stepX = w / (points.length - 1);
  const padY = 14;
  const chartH = h - padY * 2;

  // ── 网格线 ──
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  [0.25, 0.5, 0.75, 1].forEach(ratio => {
    const y = padY + (1 - ratio) * chartH + 0.5;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  });

  // ── 渐变填充 ──
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, bgColor);
  grad.addColorStop(1, 'rgba(0,0,0,0)');

  const linePoints = points.map((v, i) => ({
    x: i * stepX,
    y: padY + (1 - (v - min) / range) * chartH
  }));

  ctx.beginPath();
  linePoints.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.lineTo(linePoints[linePoints.length - 1].x, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // ── 发光线条 ──
  ctx.shadowColor = color;
  ctx.shadowBlur = 6;
  ctx.beginPath();
  linePoints.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawNet(canvasId, upPoints, downPoints, pts) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.offsetWidth;
  const h = 160;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const len = Math.min(upPoints.length, downPoints.length);
  if (len < 2) {
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('数据不足', w / 2, h / 2 + 4);
    return;
  }

  const all = [...upPoints.slice(0, len), ...downPoints.slice(0, len)];
  const max = Math.max(...all) || 1;
  const padY = 14;
  const chartH = h - padY * 2;
  const stepX = w / (len - 1);

  // ── Y轴标签（右上角显示最大值） ──
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(bytes(max) + '/s', 4, 10);

  // ── X轴标签（底部显示时间范围） ──
  ctx.textAlign = 'left';
  ctx.fillText(pts[0] ? new Date(pts[0].updated_at).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) : '', 4, h - 2);
  ctx.textAlign = 'right';
  ctx.fillText(pts[len-1] ? new Date(pts[len-1].updated_at).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) : '', w - 4, h - 2);

  // ── 网格线 ──
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  [0.25, 0.5, 0.75, 1].forEach(ratio => {
    const y = padY + (1 - ratio) * chartH + 0.5;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  });

  // ── 图例 ──
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  const legX = w - 10;

  ctx.fillStyle = '#f97316';
  ctx.fillRect(legX - 64, 4, 16, 2);
  ctx.fillText('↑ 上行', legX, 10);

  ctx.fillStyle = '#10b981';
  ctx.fillRect(legX - 64, 16, 16, 2);
  ctx.fillText('↓ 下行', legX, 22);

  function drawLinePts(pts, color) {
    const linePts = pts.slice(0, len).map((v, i) => ({
      x: i * stepX,
      y: padY + (1 - v / max) * chartH
    }));

    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, color.replace(')', ',0.2)').replace('rgb', 'rgba'));
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    linePts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.lineTo(linePts[linePts.length - 1].x, h);
    ctx.lineTo(0, h);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.shadowColor = color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    linePts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  drawLinePts(upPoints, '#f97316');
  drawLinePts(downPoints, '#10b981');
}

function renderMetrics(node, latest) {
  const cpu = latest?.cpu?.usage || 0;
  const memPct = node.mem_total > 0 ? ((latest.ram?.used || 0) / node.mem_total) * 100 : 0;
  const diskPct = node.disk_total > 0 ? ((latest.disk?.used || 0) / node.disk_total) * 100 : 0;
  const netUp = latest?.network?.up || 0;
  const netDown = latest?.network?.down || 0;

  const container = document.getElementById('metrics-grid');
  container.innerHTML = `
    <div class="metric-card">
      <span class="metric-label">CPU</span>
      <span class="metric-value">${pct(cpu)}</span>
      <div class="metric-bar"><div class="metric-fill ${metricClass(cpu)}" style="width:${Math.min(100,cpu)}%"></div></div>
    </div>
    <div class="metric-card">
      <span class="metric-label">内存</span>
      <span class="metric-value">${pct(memPct)}</span>
      <div class="metric-bar"><div class="metric-fill ${metricClass(memPct)}" style="width:${Math.min(100,memPct)}%"></div></div>
    </div>
    <div class="metric-card">
      <span class="metric-label">磁盘</span>
      <span class="metric-value">${pct(diskPct)}</span>
      <div class="metric-bar"><div class="metric-fill ${metricClass(diskPct)}" style="width:${Math.min(100,diskPct)}%"></div></div>
    </div>
    <div class="metric-card">
      <span class="metric-label">下行</span>
      <span class="metric-value">${bytes(netDown)}/s</span>
    </div>
    <div class="metric-card">
      <span class="metric-label">上行</span>
      <span class="metric-value">${bytes(netUp)}/s</span>
    </div>
    <div class="metric-card">
      <span class="metric-label">在线时长</span>
      <span class="metric-value">${uptime(latest?.uptime)}</span>
    </div>
  `;
}

function renderSysinfo(node, latest) {
  const container = document.getElementById('sysinfo-card');

  // komari 1.2: cpu_cores, swap_total, load {load1,load5,load15}, traffic_limit
  const cpuCores = node.cpu_cores || '-';
  const swapTotal = node.swap_total || 0;
  const load1 = latest?.load?.load1 ?? latest?.load1 ?? null;
  const load5 = latest?.load?.load5 ?? latest?.load5 ?? null;
  const load15 = latest?.load?.load15 ?? latest?.load15 ?? null;
  const trafficLimit = node.traffic_limit || 0;
  const process = latest?.process || '-';
  const tcp = latest?.connections?.tcp || '-';

  const rows = [
    { lbl: 'CPU 型号', val: node.cpu_name || '-', sub: cpuCores !== '-' ? `× ${cpuCores} 核心` : '' },
    { lbl: '架构', val: node.arch || '-' },
    { lbl: '虚拟化', val: node.virtualization || '-' },
    { lbl: '操作系统', val: (node.os || '-').split(' ')[0] + (node.os || '').split(' ').slice(1).join(' ').slice(0, 20) },
    { lbl: '内核版本', val: node.kernel_version || '-' },
    { lbl: 'GPU', val: (node.gpu_name && node.gpu_name !== 'None') ? node.gpu_name : '-' },
    { lbl: '内存总量', val: bytes(node.mem_total) },
    { lbl: 'Swap 总量', val: swapTotal > 0 ? bytes(swapTotal) : '无' },
    { lbl: '磁盘总量', val: bytes(node.disk_total) },
    { lbl: '流量限额', val: trafficLimit > 0 ? bytes(trafficLimit) : '无' },
    { lbl: '到期时间', val: node.expired_at ? new Date(node.expired_at).toLocaleDateString('zh-CN') : '-' },
    { lbl: '在线时长', val: uptime(latest?.uptime) },
    { lbl: '进程数', val: process },
    { lbl: 'TCP 连接', val: tcp },
    { lbl: '最后更新', val: age(latest?.updated_at) },
  ];

  // 插入负载行（在在线时长后面）
  if (load1 !== null) {
    const loadIdx = rows.findIndex(r => r.lbl === '在线时长');
    const loadRow = { lbl: '负载均值', val: `${load1} / ${load5} / ${load15}`, isLoad: true, load1, load5, load15, cpuCores };
    rows.splice(loadIdx + 1, 0, loadRow);
  }

  container.innerHTML = rows.map(r => {
    if (r.isLoad) {
      const cls = (v) => v >= (r.cpuCores || 1) * 2 ? 'high' : v >= (r.cpuCores || 1) * 1 ? 'medium' : 'low';
      return `
        <div class="sysinfo-row">
          <span class="lbl">${r.lbl}</span>
          <div class="load-row">
            <span class="load-badge ${cls(r.load1)}">1m ${r.load1}</span>
            <span class="load-badge ${cls(r.load5)}">5m ${r.load5}</span>
            <span class="load-badge ${cls(r.load15)}">15m ${r.load15}</span>
          </div>
        </div>
      `;
    }
    return `
      <div class="sysinfo-row">
        <span class="lbl">${r.lbl}</span>
        <span class="val">${r.val}</span>
      </div>
    `;
  }).join('');
}

async function init() {
  const uuid = getUuid();
  if (!uuid) { showError('缺少节点 UUID 参数'); return; }

  // ── 背景：优先读 theme_settings.videoUrl/posterUrl ──
  const publicInfo = await fetchPublicInfo();
  const themeSettings = publicInfo.theme_settings || {};
  const poster = document.getElementById('poster');
  const video = document.getElementById('bg-video');

  const posterUrl = themeSettings.posterUrl || '';
  const videoUrl = themeSettings.videoUrl || '';

  if (posterUrl) {
    poster.src = posterUrl;
    poster.style.opacity = '1';
  }
  if (videoUrl) {
    video.src = videoUrl;
    video.play().then(() => { video.style.opacity = '1'; if (posterUrl) poster.style.opacity = '0'; }).catch(() => { poster.style.opacity = '1'; });
  }

  document.getElementById('back-btn').addEventListener('click', () => { window.location.href = './'; });

  try {
    const [node, recent] = await Promise.all([fetchNodeInfo(uuid), fetchRecentData(uuid)]);
    if (!node) { showError('未找到该节点'); return; }

    document.getElementById('node-name').textContent = node.name || node.uuid;
    const region = node.region || '';
    const virt = node.virtualization || '';
    const os = (node.os || '').split(' ')[0];
    document.getElementById('node-meta').textContent = [region, virt, os].filter(Boolean).join(' · ');

    const latest = recent[0] || {};
    renderMetrics(node, latest);
    renderSysinfo(node, latest);

    const pts = [...recent].reverse();
    const cpuPts = pts.map(r => r.cpu?.usage || 0);
    const memPts = pts.map(r => {
      const total = r.ram?.total || node.mem_total || 1;
      const used = r.ram?.used || 0;
      return total > 0 ? (used / total) * 100 : 0;
    });
    const upPts = pts.map(r => r.network?.up || 0);
    const downPts = pts.map(r => r.network?.down || 0);

    document.getElementById('badge-cpu').textContent = cpuPts.length ? pct(cpuPts[cpuPts.length - 1]) : '—';
    document.getElementById('badge-mem').textContent = memPts.length ? pct(memPts[memPts.length - 1]) : '—';
    document.getElementById('badge-net').textContent = upPts.length ? '↑ ' + bytes(upPts[upPts.length - 1]) + '/s · ↓ ' + bytes(downPts[downPts.length - 1]) + '/s' : '—';

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('detail-content').classList.remove('hidden');

    // 等两帧确保 layout 完成后再画图
    requestAnimationFrame(() => requestAnimationFrame(() => {
      drawLine('chart-cpu', cpuPts, '#10b981', 'rgba(16,185,129,0.15)');
      drawLine('chart-mem', memPts, '#a855f7', 'rgba(168,85,247,0.15)');
      drawNet('chart-net', upPts, downPts, pts);
    }));

    window.addEventListener('resize', () => {
      drawLine('chart-cpu', cpuPts, '#10b981', 'rgba(16,185,129,0.15)');
      drawLine('chart-mem', memPts, '#a855f7', 'rgba(168,85,247,0.15)');
      drawNet('chart-net', upPts, downPts, pts);
    });

  } catch (err) {
    showError('加载失败: ' + err.message);
  }
}

function showError(msg) {
  document.getElementById('loading').classList.add('hidden');
  const el = document.getElementById('error-state');
  el.textContent = msg;
  el.classList.remove('hidden');
}

window.addEventListener('scroll', () => {
  const nav = document.querySelector('.detail-nav');
  if (!nav) return;
  const y = window.scrollY || document.documentElement.scrollTop;
  nav.classList.toggle('scrolled', y > 10);
});

init();
</script>
</body>
</html>
