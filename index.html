<!DOCTYPE html>
<!-- GalaxyGlass v2.2.0 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>GG 探针</title>
  <meta name="description" content="GalaxyGlass — 银河玻璃探针面板">
  <style>
    :root {
      --accent:        #10b981;
      --accent-2:      #6366f1;
      --accent-gradient: linear-gradient(135deg, #10b981, #6366f1);
      --accent-orange: #f59e0b;
      --danger:        #ef4444;
      --bg-deepest:    #050d07;
      --bg-deep:       #071109;
      --bg-surface:    #0a1a0f;
      --text-primary:   #f0fdf4;
      --text-secondary: rgba(240, 253, 244, 0.65);
      --text-muted:     rgba(240, 253, 244, 0.32);
      --glass-bg:       rgba(255,255,255,0.03);
      --glass-border:   rgba(255,255,255,0.06);
      --glass-hover:    rgba(255,255,255,0.06);
      --glass-strong:   rgba(255,255,255,0.09);
      --blur-card:      40px;
      --blur-surface:   24px;
      --blur-glass:     60px;
      --radius-sm:      8px;
      --radius-md:      12px;
      --radius-lg:      16px;
      --radius-full:    9999px;
      --gap:            16px;
      --gap-sm:         10px;
      --container-max:  1280px;
      --container-pad:  1.75rem;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 13px; overflow-y: scroll; scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-surface);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; }

    .bg-layer { position: fixed; inset: 0; z-index: -1; background: var(--bg-deep); }
    .bg-layer img, .bg-layer video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .container { max-width: var(--container-max); margin: 0 auto; padding: 0 var(--container-pad); width: 100%; }

    /* ── Navbar ── */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: transparent;
      border-bottom: 1px solid transparent;
      transition: background 0.35s ease, backdrop-filter 0.35s ease, border-color 0.35s ease;
    }
    .navbar.scrolled {
      background: rgba(5, 13, 7, 0.7) !important;
      backdrop-filter: blur(24px) saturate(120%);
      -webkit-backdrop-filter: blur(24px) saturate(120%);
      border-bottom: 1px solid var(--glass-border);
    }
    .navbar-inner {
      display: flex; align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.65rem 0;
      height: 48px;
    }
    .navbar-brand {
      display: flex; align-items: center; gap: 0.5rem;
      font-weight: 600; letter-spacing: 0.02em;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }
    .navbar-brand:hover { opacity: 0.8; }
    .navbar-title {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 17px; font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .navbar-actions { display: flex; align-items: center; gap: 0.35rem; flex-shrink: 0; }

    /* ── Search ── */
    .search-box {
      display: flex; align-items: center;
      border-radius: var(--radius-full);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: max-width 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), border-color 0.3s, background 0.3s;
      max-width: 36px; height: 36px; overflow: hidden;
    }
    .search-box:focus-within, .search-box.open { max-width: 260px; border-color: rgba(16, 185, 129, 0.3); background: rgba(255,255,255,0.05); }
    .search-box .search-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .search-box .search-icon svg { width: 15px; height: 15px; color: var(--text-muted); transition: color 0.3s; }
    .search-box:focus-within .search-icon svg, .search-box.open .search-icon svg { color: var(--accent); }
    .search-box input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text-primary); font-size: 13px;
      padding: 0 14px 0 0; opacity: 0; transition: opacity 0.3s 0.15s; min-width: 0;
    }
    .search-box.open input, .search-box:focus-within input { opacity: 1; }
    input::placeholder { color: var(--text-muted); }
    @media (max-width: 639px) { .search-box { display: none; } }

    /* ── Sort Button ── */
    .sort-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem;
      height: 36px; padding: 0 12px; font-size: 13px; font-weight: 500;
      border-radius: var(--radius-full);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      color: var(--text-secondary); cursor: pointer;
      transition: color 0.2s, background 0.2s, border-color 0.2s;
      white-space: nowrap; flex-shrink: 0;
      min-height: 36px;
    }
    .sort-btn:hover { color: var(--text-primary); background: var(--glass-hover); border-color: rgba(255,255,255,0.12); }
    .dropdown { position: relative; }
    .dropdown-menu {
      position: absolute; right: 0; margin-top: 6px;
      min-width: 150px; z-index: 200;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: rgba(5, 13, 7, 0.88);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
      padding: 6px;
      animation: fadeIn 0.12s ease;
    }
    .dropdown-menu.hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .dropdown-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
      padding: 8px 12px; font-size: 13px; color: var(--text-secondary);
      background: transparent; border: none; border-radius: var(--radius-sm); cursor: pointer;
      transition: background 0.15s, color 0.15s;
      min-height: 36px;
    }
    .dropdown-item:hover { background: var(--glass-hover); color: var(--text-primary); }
    .dropdown-item.active { color: var(--accent); background: rgba(16,185,129,0.1); }

    /* ── Main ── */
    .main { flex: 1; padding: 1.5rem 0; display: flex; flex-direction: column; gap: 1rem; }
    @media (min-width: 640px) { .main { padding: 2rem 0; } }
    .accent-bar {
      width: 64px; height: 3px;
      background: var(--accent-gradient);
      border-radius: var(--radius-full);
      margin-bottom: 14px;
      opacity: 0.85;
      animation: accentPulse 8s ease-in-out infinite;
    }
    @keyframes accentPulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 0.55; } }

    /* ── Stats ── */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: var(--gap); }
    @media (max-width: 639px) { .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
    .stat-card {
      display: flex; align-items: center; gap: var(--gap-sm);
      padding: 14px 18px;
      border-radius: var(--radius-lg);
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-surface)) saturate(150%);
      -webkit-backdrop-filter: blur(var(--blur-surface)) saturate(150%);
      border: 1px solid var(--glass-border);
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .stat-card:hover { border-color: rgba(16,185,129,0.18); box-shadow: 0 0 0 1px rgba(16,185,129,0.06); }
    @media (max-width: 639px) { .stat-card { padding: 12px 14px; } }
    .stat-card svg { width: 1.6rem; height: 1.6rem; color: var(--text-muted); flex-shrink: 0; transition: color 0.3s; }
    .stat-card:hover svg { color: var(--accent); }
    .stat-card .label { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; letter-spacing: 0.02em; }
    .stat-card .value { font-size: 15px; font-weight: 700; font-family: var(--font-mono); color: var(--text-primary); letter-spacing: -0.01em; }
    .stat-card .value.small { font-size: 12px; }
    .stat-sub { display: flex; align-items: center; gap: 4px; font-size: 12px; font-family: var(--font-mono); color: var(--text-secondary); }

    /* ── Filters ── */
    .region-filters-wrap { padding: 0 var(--container-pad); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; font-size: 12px;
      border-radius: var(--radius-full);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      color: var(--text-secondary); cursor: pointer; user-select: none;
      transition: color 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
      min-height: 36px;
    }
    .chip:hover { background: var(--glass-hover); color: var(--text-primary); }
    .chip.active {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(16,185,129,0.18), rgba(99,102,241,0.12));
      color: var(--accent);
      box-shadow: 0 0 24px rgba(16,185,129,0.12), inset 0 0 20px rgba(16,185,129,0.04);
    }

    /* ── Grid ── */
    .nodes-grid-wrap { padding: 0 var(--container-pad); }
    .nodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--gap);
      min-height: calc(100vh - 380px);
    }
    @media (min-width: 1600px) { .nodes-grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); } }
    @media (max-width: 680px) { .nodes-grid { grid-template-columns: 1fr; } }

    /* ── Skeleton ── */
    .skeleton-card {
      display: flex; flex-direction: column; gap: 12px;
      padding: 1.1rem;
      border-radius: var(--radius-lg);
      background: var(--bg-glass);
      backdrop-filter: blur(var(--blur-glass)) saturate(120%);
      -webkit-backdrop-filter: blur(var(--blur-glass)) saturate(120%);
      border: 1px solid var(--glass-border);
      min-height: 160px;
    }
    .skeleton-line {
      height: 10px; border-radius: var(--radius-full);
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
    }
    .skeleton-line:first-child { width: 60%; height: 14px; }
    .skeleton-line:nth-child(2) { width: 85%; }
    .skeleton-line:nth-child(3) { width: 100%; height: 6px; }
    .skeleton-line:nth-child(4) { width: 100%; height: 6px; }
    .skeleton-line:nth-child(5) { width: 100%; height: 6px; }
    .skeleton-line:last-child { width: 40%; margin-top: auto; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ── Card ── */
    .node-card {
      display: flex; flex-direction: column; gap: 8px;
      padding: 1rem;
      border-radius: var(--radius-lg);
      background: var(--bg-glass);
      backdrop-filter: blur(var(--blur-glass)) saturate(120%);
      -webkit-backdrop-filter: blur(var(--blur-glass)) saturate(120%);
      border: 1px solid var(--glass-border);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, border-color 0.25s ease;
      cursor: pointer;
      animation: cardIn 0.35s ease both;
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .node-card:hover {
      transform: translateY(-3px) scale(1.012);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 0 1px rgba(16,185,129,0.08);
      border-color: rgba(16,185,129,0.12);
    }
    .node-card.offline { opacity: 0.4; }
    .node-card-header { display: flex; align-items: center; gap: 7px; }
    .node-status {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .node-status.online {
      background: var(--accent);
      box-shadow: 0 0 6px rgba(16,185,129,0.5);
      animation: pulse-dot 2.5s ease-in-out infinite;
    }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; box-shadow: 0 0 6px rgba(16,185,129,0.5); } 50% { opacity: 0.6; box-shadow: 0 0 3px rgba(16,185,129,0.15); } }
    .node-status.offline { background: var(--danger); }

    .node-os-icon { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .node-os-icon::before { font-size: 14px; line-height: 1; }
    .node-os-icon[data-os*="alpine"]::before { content: "\26F0"; color: #5e81f4; }
    .node-os-icon[data-os*="debian"]::before { content: "\2666"; color: #D70A53; }
    .node-os-icon[data-os*="ubuntu"]::before { content: "\262E"; color: #E95420; }
    .node-os-icon[data-os*="centos"]::before, .node-os-icon[data-os*="rhel"]::before { content: "\25CF"; color: #9326ee; }

    .node-name { font-weight: 600; font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .node-flag { width: 24px; height: 17px; object-fit: cover; border-radius: 2px; flex-shrink: 0; }
    .node-region { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }

    .card-metrics { display: flex; flex-direction: column; gap: 4px; }
    .card-metric { display: flex; align-items: center; gap: 6px; height: 20px; }
    .card-metric .cm-label { font-size: 9px; font-weight: 700; width: 26px; text-align: right; color: var(--text-muted); flex-shrink: 0; letter-spacing: 0.02em; }
    .card-metric .cm-bar { flex: 1; height: 5px; background: rgba(255,255,255,0.06); border-radius: var(--radius-full); overflow: hidden; }
    .card-metric .cm-fill { height: 100%; border-radius: var(--radius-full); transform-origin: left; transition: transform 0.4s ease; }
    .card-metric .cm-fill.low { background: var(--accent); }
    .card-metric .cm-fill.medium { background: var(--accent-orange); }
    .card-metric .cm-fill.high { background: var(--danger); }
    .card-metric .cm-value { width: 38px; text-align: right; font-size: 11px; font-weight: 600; font-family: var(--font-mono); flex-shrink: 0; }
    .card-metric.net-row .cm-value { font-size: 10px; display: flex; gap: 4px; width: auto; }
    .card-metric.net-row .cm-value span.up { color: var(--accent-orange); }
    .card-metric.net-row .cm-value span.down { color: var(--accent); }

    .node-footer {
      display: flex; align-items: center; gap: 8px;
      padding-top: 7px; border-top: 1px solid var(--glass-border);
      font-size: 12px; font-family: var(--font-mono); color: var(--text-muted);
    }
    .node-footer-item { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
    .price-badge {
      margin-left: auto; font-weight: 700; color: var(--text-primary);
      background: var(--accent-gradient); padding: 2px 9px; border-radius: var(--radius-full);
      font-size: 11px; line-height: 1.4;
    }

    /* ── States ── */
    .loading-state, .empty-state, .error-state {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 3rem 0; color: var(--text-muted); font-size: 14px;
    }
    .error-state { color: var(--danger); flex-direction: column; gap: 12px; }
    .error-state .error-icon { font-size: 32px; }

    /* ── Detail View ── */
    .detail-view.hidden { display: none !important; }
    .detail-view { animation: fadeIn 0.2s ease; }
    .detail-nav { position: sticky; top: 0; z-index: 100; background: transparent; border-bottom: 1px solid transparent; transition: background 0.3s, backdrop-filter 0.3s, border-color 0.3s; min-height: 48px; }
    .detail-nav.scrolled { background: rgba(5, 13, 7, 0.7); backdrop-filter: blur(24px) saturate(120%); -webkit-backdrop-filter: blur(24px) saturate(120%); border-bottom: 1px solid var(--glass-border); }
    .detail-nav-inner { display: flex; align-items: center; gap: 10px; padding: 0.65rem 0; height: 48px; }
    .back-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; color: var(--text-secondary); background: transparent; border: none; cursor: pointer; padding: 6px 10px; border-radius: var(--radius-full); transition: color 0.2s, background 0.2s; min-height: 36px; }
    .back-btn:hover { color: var(--text-primary); background: var(--glass-bg); }
    .back-btn svg { width: 16px; height: 16px; }
    .detail-title-area { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .detail-name { font-weight: 600; font-size: 14px; }
    .detail-flag { width: 22px; height: 15px; object-fit: cover; border-radius: 2px; flex-shrink: 0; }
    .detail-meta { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .detail-loading, .detail-error { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 3rem 0; color: var(--text-muted); font-size: 14px; }
    .detail-error { color: var(--danger); }
    .detail-content-wrap { padding: 0 var(--container-pad); padding-top: 0.5rem; }
    .detail-content { max-width: var(--container-max); margin: 0 auto; }
    .detail-body { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); margin-top: var(--gap); }
    @media (max-width: 800px) { .detail-body { grid-template-columns: 1fr; } }
    .detail-left, .detail-right { display: flex; flex-direction: column; gap: var(--gap); }
    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap-sm); }
    @media (max-width: 480px) { .metrics-grid { grid-template-columns: repeat(2, 1fr); } }
    .metric-card { padding: 12px 14px; border-radius: var(--radius-md); background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .metric-card .metric-value { font-size: 15px; font-weight: 700; display: block; margin-top: 2px; }
    .metric-card .metric-sub { margin-top: 2px; font-size: 10px; font-family: var(--font-mono); color: var(--text-muted); }
    .metric-card .metric-bar { margin-top: 4px; height: 5px; background: rgba(255,255,255,0.07); border-radius: var(--radius-full); overflow: hidden; }
    .metric-card .metric-fill { height: 100%; border-radius: var(--radius-full); transform-origin: left; transition: transform 0.4s ease; }
    .metric-card .metric-fill.low { background: var(--accent); }
    .metric-card .metric-fill.medium { background: var(--accent-orange); }
    .metric-card .metric-fill.high { background: var(--danger); }

    .sysinfo-card, .tags-card, .traffic-card, .chart-card { padding: 12px 14px; border-radius: var(--radius-md); background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .sysinfo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-width: 0; }
    .sysinfo-grid > div { min-width: 0; overflow: hidden; }
    .sysinfo-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--glass-border); gap: 10px; }
    .sysinfo-row:last-child { border-bottom: none; }
    .sysinfo-row .lbl { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
    .sysinfo-row .val { font-size: 11px; color: var(--text-primary); text-align: right; font-family: var(--font-mono); min-width: 0; }
    .load-row { display: flex; gap: 4px; }
    .load-badge { padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
    .load-badge.low { background: rgba(16,185,129,0.15); color: var(--accent); }
    .load-badge.medium { background: rgba(245,158,11,0.15); color: var(--accent-orange); }
    .load-badge.high { background: rgba(239,68,68,0.15); color: var(--danger); }
    .sysinfo-bill { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; padding-top: 7px; margin-top: 3px; border-top: 1px solid var(--glass-border); }
    .bill-chip { padding: 3px 9px; border-radius: var(--radius-full); font-size: 11px; font-family: var(--font-mono); background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); }
    .bill-chip.danger { border-color: rgba(239,68,68,0.3); color: var(--danger); }
    .tags-card.hidden { display: none; }
    .tags-title { font-size: 10px; color: var(--text-muted); margin-bottom: 5px; letter-spacing: 0.03em; }
    .tags-list { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 5px; }
    .tag-chip { padding: 2px 7px; border-radius: 5px; font-size: 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); color: var(--text-secondary); }
    .tag-chip-alt { background: rgba(99,102,241,0.08); border-color: rgba(99,102,241,0.2); color: #a5b4fc; }
    .tag-chip-warm { background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.2); color: #fcd34d; }
    .conn-row { display: flex; gap: 8px; font-size: 11px; color: var(--text-muted); }
    .conn-item strong { color: var(--text-primary); font-weight: 600; }
    .traffic-title { font-size: 10px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.03em; }
    .traffic-row { font-size: 12px; font-family: var(--font-mono); padding: 3px 0; display: flex; align-items: center; gap: 5px; }
    .traffic-row .dir { font-weight: 700; }
    .traffic-row .dir.up { color: var(--accent-orange); }
    .traffic-row .dir.down { color: var(--accent); }
    .traffic-bar-wrap { margin: 5px 0; }
    .traffic-bar-bg { height: 5px; background: rgba(255,255,255,0.06); border-radius: var(--radius-full); overflow: hidden; }
    .traffic-bar-fill { height: 100%; border-radius: var(--radius-full); background: var(--accent-gradient); transform-origin: left; transition: transform 0.4s ease; }
    .traffic-bar-fill.warn { background: linear-gradient(90deg, var(--accent-orange), var(--warning)); }
    .traffic-bar-fill.danger { background: linear-gradient(90deg, var(--danger), #ef4444); }
    .traffic-summary { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .chart-title { font-size: 10px; color: var(--text-muted); margin-bottom: 5px; letter-spacing: 0.03em; }
    .chart-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-family: var(--font-mono); font-weight: 600; margin-bottom: 5px; }
    .chart-canvas { width: 100%; height: 130px; }
    .chart-canvas canvas { width: 100% !important; height: 130px !important; }

    /* ── Footer ── */
    .footer { padding: 1rem 0; border-top: 1px solid var(--glass-border); margin-top: 1.5rem; }
    .footer-inner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
    @media (max-width: 639px) { .footer-inner { grid-template-columns: 1fr; text-align: center; } }
    .footer-brand { font-size: 13px; font-weight: 600; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .footer-uptime { font-size: 11px; color: var(--text-muted); text-align: center; font-family: var(--font-mono); }
    .footer-powered { font-size: 11px; color: var(--text-muted); text-align: right; }
    .footer-powered a:hover { color: var(--text-primary); }

    /* ── Back to Top ── */
    .back-to-top {
      position: fixed; z-index: 50;
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--glass-strong); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary); cursor: pointer;
      opacity: 0; visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s, transform 0.3s;
      transform: scale(0.85);
    }
    .back-to-top.visible { opacity: 1; visibility: visible; transform: scale(1); }
    .back-to-top:hover { color: var(--text-primary); border-color: rgba(16,185,129,0.3); }
    .back-to-top svg { width: 15px; height: 15px; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-deepest); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.12); }
    ::selection { background: rgba(16,185,129,0.25); color: var(--text-primary); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

              <div class="chart-card"><div class="chart-title">内存占用率</div><div class="chart-badge" id="badge-mem" style="color:var(--chart-mem)">—</div><div class="chart-canvas"><canvas id="chart-mem"></canvas></div></div>
              <div class="chart-card"><div class="chart-title">网络速率</div><div class="chart-badge" id="badge-net" style="color:var(--text-secondary)">—</div><div class="chart-canvas"><canvas id="chart-net"></canvas></div></div>

</div>

<script>
(function(){'use strict';
var nodesList=[],sortMode=localStorage.getItem('nodeSort')||'default',filterRegion=null,searchQuery='',siteStart=Date.now(),exchangeRate=6.82,hasError=false;
var SORT_OPTIONS=[{value:'default',label:'默认'},{value:'name',label:'名称'},{value:'region',label:'地区'},{value:'cpu',label:'CPU 占用'},{value:'mem',label:'内存占用'},{value:'disk',label:'磁盘占用'},{value:'down',label:'下行速度'},{value:'up',label:'上行速度'},{value:'uptime',label:'在线时长'}];
function $(id){return document.getElementById(id)}
function debounce(fn,ms){var t=null;return function(){var a=arguments,c=this;clearTimeout(t);t=setTimeout(function(){fn.apply(c,a)},ms)}}
function bytes(v){if(!v||v<=0)return'0B';var u=['B','KB','MB','GB','TB','PB'];var i=Math.min(Math.floor(Math.log(v)/Math.log(1024)),u.length-1);return(v/Math.pow(1024,i)).toFixed(i<2?0:1)+u[i]}
function uptime(s){if(!s||s<=0)return'—';var d=Math.floor(s/86400),h=Math.floor((s%86400)/3600);return(d>0?d+'天 ':'')+h+'时'}
function age(t){if(!t)return'—';var diff=Math.floor((Date.now()-new Date(t).getTime())/1000);if(diff<60)return diff+'秒前';if(diff<3600)return Math.floor(diff/60)+'分钟前';return Math.floor(diff/3600)+'小时前'}
function metricClass(p){return p>=80?'high':p>=60?'medium':'low'}
function flagEmoji(r){var m={'🇺🇸':'us','🇯🇵':'jp','🇭🇰':'hk','🇳🇱':'nl','🇰🇵':'kp','🇩🇪':'de','🇸🇬':'sg','🇬🇧':'gb','🇰🇷':'kr','🇨🇳':'cn','🇷🇺':'ru','🇨🇦':'ca','🇦🇺':'au'};return m[r]||''}
function osClass(os){if(!os)return'';os=os.toLowerCase();if(os.includes('alpine'))return'alpine';if(os.includes('debian'))return'debian';if(os.includes('ubuntu'))return'ubuntu';if(os.includes('centos')||os.includes('rhel'))return'centos';return''}
function mergeNodeData(node,recent){var r=recent&&recent.length?recent[0]:{};return Object.assign({},node,{cpu_usage:(r.cpu&&r.cpu.usage)||0,mem_used:(r.ram&&r.ram.used)||0,disk_used:(r.disk&&r.disk.used)||0,net_up:(r.network&&r.network.up)||0,net_down:(r.network&&r.network.down)||0,total_up:(r.network&&r.network.totalUp)||0,total_down:(r.network&&r.network.totalDown)||0,uptime_sec:r.uptime||0,load1:r.load&&r.load.load1,load5:r.load&&r.load.load5,load15:r.load&&r.load.load15,connections:r.connections,process:r.process,online:!!r.updated_at,updated_at:r.updated_at||node.updated_at})}
async function fetchJSON(url,timeoutMs){timeoutMs=timeoutMs||15000;try{var ctrl=new AbortController();var timer=setTimeout(function(){ctrl.abort()},timeoutMs);var r=await fetch(url,{signal:ctrl.signal});clearTimeout(timer);return await r.json()}catch(e){return null}}

function renderSkeletons(){var grid=$('grid-view');if(!grid)return;var html='';for(var i=0;i<8;i++){html+='<div class="skeleton-card" style="animation-delay:'+(i*40)+'ms">';for(var j=0;j<5;j++)html+='<div class="skeleton-line"></div>';html+='</div>'}grid.innerHTML=html}

async function loadData(){renderSkeletons();var siteData=await fetchJSON('/api/public');if(siteData&&siteData.theme_settings){var ts=siteData.theme_settings;$('poster').src=ts.posterUrl||'https://img.357561.xyz/image-wallpaper2.png';$('bg-video').src=ts.videoUrl||'';if(ts.videoUrl){$('bg-video').play().then(function(){$('bg-video').style.opacity='1';$('poster').style.opacity='0'}).catch(function(){})}if(ts.buildTime){var p=new Date(ts.buildTime);if(!isNaN(p.getTime()))siteStart=p.getTime()}if(siteData.sitename){document.querySelectorAll('#site-name,#footer-brand').forEach(function(el){el.textContent=siteData.sitename});document.title=siteData.sitename}}
var rateData=await fetchJSON('https://v6.exchangerate-api.com/v6/4eb672eb050aa81c7d8ddca1/latest/USD');if(rateData&&rateData.conversion_rates&&rateData.conversion_rates.CNY){exchangeRate=rateData.conversion_rates.CNY;var re=$('stat-cost-rate');if(re)re.textContent='@'+exchangeRate.toFixed(2)}
var nodeData=await fetchJSON('/api/nodes');if(!nodeData||!nodeData.data){hasError=true;$('grid-view').innerHTML='<div class="error-state"><div class="error-icon">⚠️</div><span>无法连接到服务器，请检查后端状态</span></div>';return}hasError=false
var raw=nodeData.data;var merged=await Promise.all(raw.map(async function(node){var recent=await fetchJSON('/api/recent/'+node.uuid);return mergeNodeData(node,recent?recent.data:[])}));nodesList=merged;render()}

function render(){if(hasError)return;clearAnimDelays();var filtered=nodesList.filter(function(n){if(filterRegion&&n.region!==filterRegion)return false;if(searchQuery){var q=searchQuery.toLowerCase(),name=(n.name||'').toLowerCase(),region=(n.region||'').toLowerCase(),tags=(n.tags||'').toLowerCase(),uuid=(n.uuid||'').toLowerCase();if(name.indexOf(q)===-1&&region.indexOf(q)===-1&&tags.indexOf(q)===-1&&uuid.indexOf(q)===-1)return false}return true});sortNodes(filtered);var grid=$('grid-view')
if(nodesList.length===0){grid.innerHTML='<div class="empty-state"><span>暂无节点</span></div>';return}
if(filtered.length===0){grid.innerHTML='<div class="empty-state"><span>没有匹配的节点</span></div>'}else{grid.innerHTML=filtered.map(renderCard).join('')}
updateStats();buildRegionFilters();positionBackToTop()}
function clearAnimDelays(){nodesList.forEach(function(n){delete n._animDelay})}
function sortNodes(arr){var fns={default:function(a,b){return(b.online?1:0)-(a.online?1:0)||(a.weight||0)-(b.weight||0)},name:function(a,b){return(a.name||'').localeCompare(b.name||'')},region:function(a,b){return(a.region||'').localeCompare(b.region||'')},cpu:function(a,b){return(b.cpu_usage||0)-(a.cpu_usage||0)},mem:function(a,b){return((b.mem_used||0)/(b.mem_total||1)-(a.mem_used||0)/(a.mem_total||1))},disk:function(a,b){return((b.disk_used||0)/(b.disk_total||1)-(a.disk_used||0)/(a.disk_total||1))},down:function(a,b){return(b.net_down||0)-(a.net_down||0)},up:function(a,b){return(b.net_up||0)-(a.net_up||0)},uptime:function(a,b){return(b.uptime_sec||0)-(a.uptime_sec||0)}};arr.sort(fns[sortMode]||fns.default);var i=0;arr.forEach(function(n){n._animDelay=i++})}

function renderCard(n){var d=(n._animDelay||0)*30,oc=osClass(n.os),cpu=n.cpu_usage||0,mp=n.mem_total>0?((n.mem_used||0)/n.mem_total)*100:0,dp=n.disk_total>0?((n.disk_used||0)/n.disk_total)*100:0,on=n.online,fc=flagEmoji(n.region),up=n.net_up||0,down=n.net_down||0
return'<div class="node-card'+(on?'':' offline')+'" data-uuid="'+n.uuid+'" tabindex="0" role="listitem" style="animation-delay:'+d+'ms">'
+'<div class="node-card-header"><div class="node-status '+(on?'online':'offline')+'"></div>'+(oc?'<span class="node-os-icon" data-os="'+oc+'"></span>':'')+'<div class="node-name">'+(n.name||n.uuid||'—')+'</div>'+(n.region?'<div class="node-region">'+(fc?'<img class="node-flag" src="https://flagcdn.com/'+fc+'.svg" alt="" loading="lazy">':'')+'</div>':'')+'</div>'
+'<div class="card-metrics">'
+'<div class="card-metric"><span class="cm-label">CPU</span><div class="cm-bar"><div class="cm-fill '+metricClass(cpu)+'" style="transform:scaleX('+Math.min(1,cpu/100)+')"></div></div><span class="cm-value" style="color:'+(cpu>=80?'var(--danger)':cpu>=60?'var(--accent-orange)':'var(--accent)')+'">'+cpu.toFixed(1)+'%</span></div>'
+'<div class="card-metric"><span class="cm-label">MEM</span><div class="cm-bar"><div class="cm-fill '+metricClass(mp)+'" style="transform:scaleX('+Math.min(1,mp/100)+')"></div></div><span class="cm-value" style="color:'+(mp>=80?'var(--danger)':mp>=60?'var(--accent-orange)':'var(--accent)')+'">'+mp.toFixed(1)+'%</span></div>'
+'<div class="card-metric"><span class="cm-label">DSK</span><div class="cm-bar"><div class="cm-fill '+metricClass(dp)+'" style="transform:scaleX('+Math.min(1,dp/100)+')"></div></div><span class="cm-value" style="color:'+(dp>=80?'var(--danger)':dp>=60?'var(--accent-orange)':'var(--accent)')+'">'+dp.toFixed(1)+'%</span></div>'
+'<div class="card-metric net-row"><span class="cm-label">NET</span><div class="cm-bar"></div><span class="cm-value"><span class="up">↑'+bytes(up)+'/s</span><span class="down">↓'+bytes(down)+'/s</span></span></div>'
+'</div><div class="node-footer"><span class="node-footer-item">🕐 '+uptime(n.uptime_sec)+'</span>'+(n.price?'<span class="price-badge">'+(n.currency||'¥')+n.price+'/'+(n.billing_cycle===365?'年':n.billing_cycle===30?'月':n.billing_cycle===1095?'3年':n.billing_cycle===0?'永久':'期')+'</span>':'')+'</div></div>'}

function updateStats(){var on=0,ttUp=0,ttDown=0,tc=0,tr=0,rs={};nodesList.forEach(function(n){if(n.online){on++;if(n.region)rs[n.region]=true}ttUp+=n.total_up||0;ttDown+=n.total_down||0
if(n.price&&n.billing_cycle>0){var rate=n.currency==='$'?exchangeRate:1,p=n.price*rate;if(n.billing_cycle===30)tc+=p;else if(n.billing_cycle===365)tc+=p/12;else if(n.billing_cycle===1095)tc+=p/36;if(n.expired_at){var remain=Math.max(0,(new Date(n.expired_at).getTime()-Date.now())/86400000);tr+=p*remain/n.billing_cycle}}})
var total=nodesList.length,off=total-on;$('stat-online-value').textContent=on+'/'+total;$('stat-region-value').innerHTML=(off>0?'<span style="color:var(--danger)">'+off+' 离线</span> · ':'')+'点亮区域 '+Object.keys(rs).length
$('stat-traffic-up').textContent='↑ '+bytes(ttUp);$('stat-traffic-down').textContent='↓ '+bytes(ttDown)
var ru=0,rd=0;nodesList.forEach(function(n){ru+=n.net_up||0;rd+=n.net_down||0});$('stat-traffic-rate').innerHTML='<span>⚡↑ '+bytes(ru)+'/s</span> · <span>⚡↓ '+bytes(rd)+'/s</span>'
$('stat-cost-monthly').textContent='¥'+Math.round(tc)+(tr>0?' · 剩余 ¥'+Math.round(tr):'');$('stat-cost-usd').textContent='≈ $'+(tc/exchangeRate).toFixed(2)+(tr>0?' / $'+(tr/exchangeRate).toFixed(2):'')}

function buildRegionFilters(){var m={};nodesList.forEach(function(n){if(n.region)m[n.region]=(m[n.region]||0)+1});var r=Object.keys(m).sort(function(a,b){return m[b]-m[a]});var c=$('region-filters');if(r.length===0){c.innerHTML='';return}
var h='<div class="filters">';h+='<button class="chip'+(filterRegion===null?' active':'')+'" data-region="">全部 '+nodesList.length+'</button>';r.forEach(function(k){var fc=flagEmoji(k),fi=fc?'<img src="https://flagcdn.com/'+fc+'.svg" alt="" style="width:18px;height:13px;object-fit:cover;border-radius:2px;" loading="lazy">':'';h+='<button class="chip'+(filterRegion===k?' active':'')+'" data-region="'+k+'">'+fi+k+' '+m[k]+'</button>'});h+='</div>';c.innerHTML=h
c.querySelectorAll('.chip').forEach(function(b){b.addEventListener('click',function(){filterRegion=this.dataset.region||null;render()})})}

function positionBackToTop(){var btn=$('back-to-top'),grid=$('grid-view');if(!btn||!grid)return;var cards=grid.querySelectorAll('.node-card');if(cards.length===0)return;var last=cards[cards.length-1],lr=last.getBoundingClientRect(),gr=grid.getBoundingClientRect();var bottom=lr.bottom+window.scrollY;var dist=document.documentElement.scrollHeight-bottom;btn.style.bottom=Math.max(4,dist)+'px';btn.style.top='auto';btn.style.right=Math.max(4,(window.innerWidth-gr.right+16)/3)+'px'}

function showDetailView(uuid){$('detail-view').classList.remove('hidden');$('list-view').classList.add('hidden');window.scrollTo(0,0);loadDetailData(uuid)}
function showListView(){window.removeEventListener('resize',redrawDetailCharts);window._detailChartData=null;$('detail-view').classList.add('hidden');$('list-view').classList.remove('hidden');window.scrollTo(0,0)}

var node=nodesList.find(function(n){return n.uuid===uuid});var nP=node?Promise.resolve(node):fetchJSON('/api/nodes').then(function(d){return(d.data||[]).find(function(n){return n.uuid===uuid})})

function renderDetailView(node,recent){var latest=recent[0]||{},pts=recent.slice().reverse()
$('detail-name').textContent=node.name||node.uuid;var fc=flagEmoji(node.region),fi=fc?'<img class="detail-flag" src="https://flagcdn.com/'+fc+'.svg" alt="" loading="lazy">':'',oc=osClass(node.os),oi=oc?'<span class="node-os-icon" data-os="'+oc+'" style="width:14px;height:14px;font-size:12px;"></span>':'';$('detail-meta').innerHTML=fi+oi+' '+[node.region,node.virtualization,(node.os||'').split(' ')[0]].filter(Boolean).join(' · ')

$('detail-metrics').innerHTML=[{label:'CPU',value:cpu.toFixed(1)+'%',pct:cpu,sub:''},{label:'内存',value:mp.toFixed(1)+'%',pct:mp,sub:bytes(mu)+' / '+bytes(node.mem_total)},{label:'磁盘',value:dp.toFixed(1)+'%',pct:dp,sub:bytes(du)+' / '+bytes(node.disk_total)},{label:'在线',value:uptime(latest.uptime)},{label:'网络',value:'↑'+bytes(nu)+'/s ↓'+bytes(nd)+'/s'},{label:'流量',value:bytes(traf)+(tl>0?' / '+bytes(tl):'')}].map(function(m){return'<div class="metric-card"><span class="metric-label">'+m.label+'</span><span class="metric-value">'+m.value+'</span>'+(m.sub?'<span class="metric-sub">'+m.sub+'</span>':'')+(m.pct!==undefined?'<div class="metric-bar"><div class="metric-fill '+metricClass(m.pct)+'" style="transform:scaleX('+Math.min(1,m.pct/100)+')"></div></div>':'')+'</div>'}).join('')
var l1=latest.load&&latest.load.load1||latest.load1,l5=latest.load&&latest.load.load5||latest.load5,l15=latest.load&&latest.load.load15||latest.load15,cores=node.cpu_cores||1

var rightRows=[{l:'流量限额',v:tl>0?bytes(tl):'无'},{l:'进程数',v:latest.process||'-'},{l:'TCP',v:(latest.connections&&latest.connections.tcp)||'-'},{l:'更新',v:age(latest.updated_at)},{l:'在线',v:uptime(latest.uptime)},{l:'到期',v:node.expired_at?new Date(node.expired_at).toLocaleDateString('zh-CN'):'-'}]
if(l1!==null){rightRows.splice(rightRows.findIndex(function(r){return r.l==='在线'})+1,0,{l:'负载',isLoad:true,v1:l1,v5:l5,v15:l15,cores:cores})}
function rr(r){if(r.isLoad)return'<div class="sysinfo-row"><span class="lbl">'+r.l+'</span><div class="load-row"><span class="load-badge '+lc(r.v1)+'">1m '+r.v1+'</span><span class="load-badge '+lc(r.v5)+'">5m '+r.v5+'</span><span class="load-badge '+lc(r.v15)+'">15m '+r.v15+'</span></div></div>';return'<div class="sysinfo-row"><span class="lbl">'+r.l+'</span><span class="val">'+r.v+'</span></div>'}
var tp=tl>0?(traf/tl)*100:0,ps=node.price?(node.currency||'¥')+node.price+'/'+(node.billing_cycle===365?'年':node.billing_cycle===30?'月':node.billing_cycle===1095?'3年':node.billing_cycle===0?'永久':'期'):'无',dl=node.expired_at?Math.max(0,Math.ceil((new Date(node.expired_at).getTime()-Date.now())/86400000)):null
$('detail-sysinfo').innerHTML='<div class="sysinfo-grid"><div>'+leftRows.map(rr).join('')+'</div><div>'+rightRows.map(rr).join('')+'</div><div class="sysinfo-bill"><span class="bill-chip">'+ps+'</span><span class="bill-chip'+(tp>=80?' danger':'')+'">📊 '+bytes(traf)+(tl>0?'/'+bytes(tl):'')+'</span><span class="bill-chip'+(dl!==null&&dl<15?' danger':'')+'">📅 '+(dl!==null?dl+'天':'永久')+'</span></div></div>'
var tags=node.tags?String(node.tags).split(',').filter(function(t){return t.trim()}):[],tcp=(latest.connections&&latest.connections.tcp)||0,udp=(latest.connections&&latest.connections.udp)||0,te=$('detail-tags')
if(tags.length===0&&!tcp&&!udp){te.classList.add('hidden')}else{te.classList.remove('hidden');var tc2=['','-alt','-warm',''];var th='';var ch='';if(tags.length){th='<div class=\"tags-list\">';for(var _i=0;_i<tags.length;_i++){th+='<span class=\"tag-chip'+(tc2[_i%4]||'')+'\">'+tags[_i].trim()+'</span>'}th+='</div>'}if(tcp||udp){ch='<div class=\"conn-row\"><span class=\"conn-item\">'+tcp+' TCP</span><span class=\"conn-item\">'+udp+' UDP</span></div>'}te.innerHTML='<div class=\"tags-title\">标签 · 连接</div>'+th+ch}$('badge-mem').textContent=mp.toFixed(1)+'%';$('badge-net').textContent='↑ '+bytes(nu)+'/s · ↓ '+bytes(nd)+'/s'
$('detail-loading').classList.add('hidden');$('detail-content').classList.remove('hidden')
requestAnimationFrame(function(){requestAnimationFrame(function(){var cpuPts=pts.map(function(r){return(r.cpu&&r.cpu.usage)||0}),memPts=pts.map(function(r){var t=(r.ram&&r.ram.total)||node.mem_total||1,u=(r.ram&&r.ram.used)||0;return t>0?(u/t)*100:0}),upPts=pts.map(function(r){return(r.network&&r.network.up)||0}),downPts=pts.map(function(r){return(r.network&&r.network.down)||0})
drawLineChart('chart-cpu',cpuPts,'#10b981','rgba(16,185,129,0.12)');drawLineChart('chart-mem',memPts,'#6366f1','rgba(99,102,241,0.12)');drawNetChart('chart-net',upPts,downPts,pts);window._detailChartData={cpuPts:cpuPts,memPts:memPts,upPts:upPts,downPts:downPts,pts:pts};window.addEventListener('resize',redrawDetailCharts)})})}
function redrawDetailCharts(){var d=window._detailChartData;if(!d)return;drawLineChart('chart-cpu',d.cpuPts,'#10b981','rgba(16,185,129,0.12)');drawLineChart('chart-mem',d.memPts,'#6366f1','rgba(99,102,241,0.12)');drawNetChart('chart-net',d.upPts,d.downPts,d.pts)}
function getCtx(id){var c=document.getElementById(id);if(!c)return null;var ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,w=c.offsetWidth,h=parseInt(c.style.height)||130;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';ctx.scale(dpr,dpr);return{ctx:ctx,w:w,h:h}}
function drawLineChart(id,points,color,bgColor){var o=getCtx(id);if(!o)return;var ctx=o.ctx,w=o.w,h=o.h;ctx.clearRect(0,0,w,h)
if(!points||points.length<2){ctx.fillStyle='rgba(255,255,255,0.15)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('数据不足',w/2,h/2+4);return}
var min=Math.min.apply(null,points),max=Math.max.apply(null,points),range=max-min||1,step=w/(points.length-1),py=10,ch=h-py*2
ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;[0.25,0.5,0.75].forEach(function(r){var y=py+(1-r)*ch+0.5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()})
var lp=points.map(function(v,i){return{x:i*step,y:py+(1-(v-min)/range)*ch}})
var g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,bgColor);g.addColorStop(1,'rgba(0,0,0,0)')
ctx.beginPath();lp.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)});ctx.lineTo(lp[lp.length-1].x,h);ctx.lineTo(0,h);ctx.closePath();ctx.fillStyle=g;ctx.fill()
ctx.shadowColor=color;ctx.shadowBlur=4;ctx.beginPath();lp.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)});ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();ctx.shadowBlur=0
var lt=lp[lp.length-1];ctx.beginPath();ctx.arc(lt.x,lt.y,3,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.beginPath();ctx.arc(lt.x,lt.y,1.5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill()}
function drawNetChart(id,upPts,downPts,pts){var o=getCtx(id);if(!o)return;var ctx=o.ctx,w=o.w,h=o.h;ctx.clearRect(0,0,w,h);var len=Math.min(upPts.length,downPts.length)
if(len<2){ctx.fillStyle='rgba(255,255,255,0.15)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('数据不足',w/2,h/2+4);return}
var all=[];for(var i=0;i<len;i++){all.push(upPts[i]);all.push(downPts[i])};var mv=Math.max.apply(null,all)||1,py=10,ch=h-py*2,step=w/(len-1)
ctx.fillStyle='rgba(255,255,255,0.25)';ctx.font='9px sans-serif';ctx.textAlign='left';ctx.fillText(bytes(mv)+'/s',4,10);if(pts[0]){ctx.textAlign='left';ctx.fillText(new Date(pts[0].updated_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),4,h-2)};if(pts[len-1]){ctx.textAlign='right';ctx.fillText(new Date(pts[len-1].updated_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),w-4,h-2)}
ctx.font='10px sans-serif';ctx.textAlign='right';ctx.fillStyle='#f59e0b';ctx.fillRect(w-58,4,14,2);ctx.fillText('↑ 上行',w-4,10);ctx.fillStyle='#10b981';ctx.fillRect(w-58,16,14,2);ctx.fillText('↓ 下行',w-4,22)
ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;[0.25,0.5,0.75].forEach(function(r){var gy=py+(1-r)*ch+0.5;ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(w,gy);ctx.stroke()})
function dl(pv,color){var lp2=pv.slice(0,len).map(function(v,i){return{x:i*step,y:py+(1-v/mv)*ch}});var g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,color.replace(')',',0.15)').replace('rgb','rgba'));g.addColorStop(1,'rgba(0,0,0,0)')
ctx.beginPath();lp2.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)});ctx.lineTo(lp2[lp2.length-1].x,h);ctx.lineTo(0,h);ctx.closePath();ctx.fillStyle=g;ctx.fill()
ctx.shadowColor=color;ctx.shadowBlur=4;ctx.beginPath();lp2.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)});ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();ctx.shadowBlur=0
var lt2=lp2[lp2.length-1];ctx.beginPath();ctx.arc(lt2.x,lt2.y,3,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.beginPath();ctx.arc(lt2.x,lt2.y,1.5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill()}
dl(upPts,'#f59e0b');dl(downPts,'#10b981')}

function setupEvents(){

document.addEventListener('click',function(e){if(!sb.contains(e.target)){sb.classList.remove('open');si.blur()}})

var sBtn=$('sort-btn'),sM=$('sort-menu');sBtn.addEventListener('click',function(e){e.stopPropagation();sM.classList.toggle('hidden')})
document.addEventListener('click',function(){sM.classList.add('hidden')});sM.querySelectorAll('.dropdown-item').forEach(function(item){item.addEventListener('click',function(){sortMode=this.dataset.sort;localStorage.setItem('nodeSort',sortMode);updateSortUI();render();sM.classList.add('hidden')})})

function setupScroll(){var n=$('navbar'),bt=$('back-to-top'),scrolled=false,ticking=false;window.addEventListener('scroll',function(){if(!ticking){window.requestAnimationFrame(function(){var y=window.scrollY||document.documentElement.scrollTop;if(y>25&&!scrolled){scrolled=true;n.classList.add('scrolled');bt.classList.add('visible')}else if(y<=25&&scrolled){scrolled=false;n.classList.remove('scrolled');bt.classList.remove('visible')};ticking=false});ticking=true}},{passive:true})
