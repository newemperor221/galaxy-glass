<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Komari Monitor</title>
  <meta name="description" content="A simple server monitor tool.">
  <style>
    /* ========================================
       GalaxyGlass for Komari
       GalaxyGlass - Komari
    ======================================== */
    
    :root {
      --accent: #10b981;
      --accent-orange: #f97316;
      --danger: #ef4444;
      --text-primary: #fff;
      --text-secondary: rgba(255,255,255,0.7);
      --text-muted: rgba(255,255,255,0.35);
      --glass-bg: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.08);
      --glass-blur-bg: rgba(0,0,0,0.35);
      --radius: 16px;
      --font-mono: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 14px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica', Arial, sans-serif;
      background: #0a1a0f;
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; }

    /* === 背景层 === */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: #0a1a0f;
    }
    .bg-layer img, .bg-layer video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* === 页面布局 === */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 10;
    }

    /* === 容器 === */
    .container {
      max-width: 1124px;
      margin: 0 auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    /* === 导航栏 === */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: transparent;
      border-bottom: 1px solid transparent;
      transition: background 0.3s, backdrop-filter 0.3s, -webkit-backdrop-filter 0.3s, border-color 0.3s;
    }
    .navbar.scrolled {
      background: rgba(0, 0, 0, 0.4) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .navbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.75rem 0;
    }
    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      letter-spacing: 0.025em;
      transition: opacity 0.2s;
      min-width: 0;
      flex-shrink: 0;
      height: 2.25rem;
    }
    .navbar-brand:hover { opacity: 0.8; }
    .navbar-logo {
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 0.25rem;
      object-fit: contain;
      flex-shrink: 0;
    }
    .navbar-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 20px;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    .navbar-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .navbar-mobile-search {
      padding: 0.25rem 0 0.75rem;
    }
    .navbar-mobile-search.hidden { display: none; }
    @media (min-width: 640px) {
      .navbar-mobile-search { display: none !important; }
    }

    /* === 搜索框 === */
    .search-box {
      display: flex;
      align-items: center;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      width: 36px;
      height: 36px;
      overflow: hidden;
    }
    .search-box.open { width: 240px; }
    .search-box .search-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .search-box .search-icon svg { width: 16px; height: 16px; color: rgba(255,255,255,0.5); }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 13px;
      padding: 0 12px 0 0;
      opacity: 0;
      transition: opacity 0.4s 0.2s;
      min-width: 0;
    }
    .search-box.open input { opacity: 1; }

    /* === 按钮通用 === */
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      height: 36px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .icon-btn:hover { color: var(--text-primary); }
    .icon-btn.round {
      width: 36px;
      padding: 0;
      flex-shrink: 0;
    }

    /* === 视图切换 === */
    .view-toggle {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 3px;
      gap: 2px;
      height: 36px;
    }
    .view-toggle-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      width: calc(50% - 4px);
      height: calc(100% - 6px);
      border-radius: 9999px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.2);
      transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      pointer-events: none;
    }
    .view-toggle-slider.table { transform: translateX(calc(100% + 2px)); }
    .view-toggle-btn {
      position: relative;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 4px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 9999px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      transition: color 0.2s;
      white-space: nowrap;
    }
    .view-toggle-btn.active { color: var(--text-primary); }
    .view-toggle-btn svg { width: 14px; height: 14px; }

    /* === 下拉菜单 === */
    .dropdown {
      position: relative;
    }
    .dropdown-menu {
      position: absolute;
      right: 0;
      margin-top: 6px;
      min-width: 140px;
      z-index: 20;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
      padding: 6px;
      animation: fadeIn 0.15s ease;
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      text-decoration: none;
    }
    .dropdown-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
    .dropdown-item.active { color: var(--accent); background: rgba(16,185,129,0.12); }
    .dropdown-item svg { width: 13px; height: 13px; flex-shrink: 0; opacity: 0.6; }
    .dropdown-item.active svg { opacity: 1; }

    /* === 主内容 === */
    .main {
      flex: 1;
      padding: 1.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    @media (min-width: 640px) {
      .main { padding: 2rem 0; }
    }

    /* === 统计栏 === */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    @media (max-width: 639px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .stat-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.08);
      transition: all 0.3s;
    }
    .stat-card svg { width: 1.25rem; height: 1.25rem; color: rgba(255,255,255,0.4); flex-shrink: 0; }
    .stat-card .label { font-size: 11px; color: rgba(255,255,255,0.35); margin-bottom: 4px; }
    .stat-card .value { font-size: 14px; font-weight: 600; font-family: var(--font-mono); color: var(--text-primary); }
    .stat-card .value.small { font-size: 12px; }
    .stat-sub { display: flex; align-items: center; gap: 4px; font-size: 12px; font-family: var(--font-mono); }
    .stat-sub svg { width: 10px; height: 10px; }
    .stat-sub-row { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
    .stat-sub-col { display: flex; flex-direction: column; gap: 2px; }

    /* === 筛选器 === */
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
    .chip.active {
      border-color: rgba(16,185,129,0.5);
      background: rgba(16,185,129,0.15);
      color: var(--accent);
    }
    .chip .count { font-size: 10px; opacity: 0.6; }
    .chip svg { width: 16px; height: 12px; object-fit: cover; border-radius: 1px; }

    /* === 节点网格 === */
    .nodes-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-content: start;
      min-height: calc(100vh - 380px);
    }
    @media (min-width: 640px) { .nodes-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .nodes-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1280px) { .nodes-grid { grid-template-columns: repeat(4, 1fr); } }

    /* === 节点卡片 === */
    .node-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 1rem;
      border-radius: 16px;
      background: var(--glass-blur-bg);
      backdrop-filter: blur(80px) saturate(180%);
      -webkit-backdrop-filter: blur(80px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      min-height: 160px;
    }
    .node-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      border-color: rgba(255,255,255,0.15);
    }
    .node-card.offline { opacity: 0.6; }
    .node-card-header { display: flex; align-items: center; gap: 8px; }
    .node-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .node-status.online { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .node-status.offline { background: #ef4444; }
    .node-os-icon { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
    .node-name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .node-flag { width: 20px; height: 14px; object-fit: cover; border-radius: 1px; flex-shrink: 0; }
    .node-info { font-size: 12px; font-family: var(--font-mono); color: rgba(255,255,255,0.45); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* === 指标 === */
    .metrics { display: flex; flex-direction: column; gap: 10px; }
    .metric-row { display: flex; flex-direction: column; gap: 4px; }
    .metric-header { display: flex; justify-content: space-between; font-size: 12px; }
    .metric-label { color: rgba(255,255,255,0.6); }
    .metric-value { font-weight: 500; color: var(--text-primary); }
    .metric-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 9999px; overflow: hidden; }
    .metric-fill { height: 100%; border-radius: 9999px; transition: width 0.3s; }
    .metric-fill.low { background: #10b981; }
    .metric-fill.medium { background: #f59e0b; }
    .metric-fill.high { background: #ef4444; }
    .metric-sub { font-size: 10px; font-family: var(--font-mono); color: rgba(255,255,255,0.35); }

    /* === 卡片底部 === */
    .node-footer { padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.1); font-size: 12px; font-family: var(--font-mono); color: rgba(255,255,255,0.35); display: flex; flex-direction: column; gap: 6px; }
    .node-footer-row { display: flex; align-items: center; gap: 12px; }
    .node-footer-item { display: flex; align-items: center; gap: 4px; }
    .node-footer-item svg { width: 12px; height: 12px; }
    .node-footer-time { margin-left: auto; }
    .node-footer-price { margin-left: auto; font-weight: 500; color: rgba(255,255,255,0.6); }
    .node-footer-expire { margin-left: 8px; color: rgba(255,255,255,0.5); }

    /* === 标签 === */
    .node-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      padding: 2px 8px;
      font-size: 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.5);
    }
    .glass-badge {
      display: inline-flex;
      align-items: center;
      height: 2.25rem;
      padding: 0 1rem;
      font-size: 14px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* === 表格视图 === */
    .table-view {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 1124px;
      margin: 16px auto 0;
      width: 100%;
    }
    #table-body { display: flex; flex-direction: column; gap: 16px; }

    /* === 表格行：flex 布局，抄自 NodeTable.tsx === */
    .table-row {
      display: flex;
      align-items: center;
      padding: 10px 30px 10px 55px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      gap: 12px;
    }
    .table-row:hover {
      background: rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.3);
    }
    .table-row.offline { opacity: 0.5; }

    /* 左侧名称区 */
    .row-title {
      width: 160px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .name-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .virt-line {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding-left: 20px;
    }
    .node-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .node-status.online { background: #10b981; box-shadow: 0 0 6px #10b981; }
    .node-status.offline { background: #ef4444; }

    /* 分隔线 */
    .table-sep {
      width: 1px;
      height: 28px;
      background: rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    /* 右侧6列数据区 */
    .table-data {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 10px;
      flex: 1;
      align-items: center;
    }

    /* 每列：label + 进度条（可选） + 数值 */
    .table-cell {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1px;
      text-align: center;
    }
    .cell-label {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }
    .cell-bar {
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      margin-bottom: 2px;
    }
    .cell-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.5s ease;
    }
    .cell-bar-fill.ok { background: #10b981; }
    .cell-bar-fill.warn { background: #f59e0b; }
    .cell-bar-fill.danger { background: #ef4444; }
    .cell-value {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      font-family: var(--font-mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* === 页脚 === */
    .footer {
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 1rem 1.5rem;
      position: relative;
      z-index: 10;
    }
    .footer-inner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    .footer-inner > *:first-child {
      justify-self: start;
    }
    .footer-inner > *:nth-child(2) {
      justify-self: center;
    }
    .footer-inner > *:last-child {
      justify-self: end;
    }
    .footer-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .footer-brand img {
      width: 1.25rem;
      height: 1.25rem;
      border-radius: 4px;
      object-fit: contain;
    }
    .footer-brand span {
      font-size: 12px;
    }
    .footer a { color: rgba(255,255,255,0.6); text-decoration: none; transition: color 0.3s; font-size: 12px; pointer-events: none; }

    /* === 回到顶部 === */
    .back-to-top {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 20;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .back-to-top.visible { opacity: 1; visibility: visible; }
    .back-to-top:hover { background: rgba(255,255,255,0.15); color: var(--text-primary); border-color: rgba(255,255,255,0.2); }
    .back-to-top svg { width: 20px; height: 20px; }

    /* ── Detail View ── */
    .detail-view { min-height: 100vh; }
    .detail-view.hidden { display: none; }
    .detail-nav {
      position: sticky; top: 0; z-index: 20;
      background: transparent;
      border-bottom: 1px solid transparent;
      transition: background 0.3s, border-color 0.3s, backdrop-filter 0.3s;
    }
    .detail-nav.scrolled {
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .detail-nav-inner {
      display: flex; align-items: center; gap: 12px;
      padding: 0.75rem 0;
    }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 9999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);

<script>
// ========================================
// GalaxyGlass - Komari Integration
// Komari API 适配版本
// ========================================

let nodes = {};  // Map<uuid, node>
let nodesList = [];  // Flat array
let viewMode = localStorage.getItem('nodeViewMode') || 'grid';
let sortMode = localStorage.getItem('nodeSort') || 'default';
let filterRegion = null;
// 速率计算：记录上次累计值和时间戳
let _lastNetTx = 0, _lastNetRx = 0, _lastNetTs = 0;
let filterTag = null;
let searchQuery = '';

// Utils
function bytes(b) {
  if (!b || b === 0) return '0 B';
  const k = 1024, sizes = ['B','KB','MB','GB','TB','PB'];
  const i = Math.floor(Math.log(b) / Math.log(k));
  return parseFloat((b / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function relativeAge(ts) {
  if (!ts) return '-';
  const diff = Date.now() - new Date(ts).getTime();
  if (diff < 0) return '刚刚';
  const s = Math.floor(diff / 1000);
  if (s < 60) return '刚刚';
  const m = Math.floor(s / 60);
  if (m < 60) return m + '分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + '小时前';
  const d = Math.floor(h / 24);
  if (d < 30) return d + '天前';
  return new Date(ts).toLocaleDateString('zh-CN');
}

function uptime(s) {
  if (!s || s < 0) return '-';
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d > 0) return d + '天' + h + '时';
  if (h > 0) return h + '时' + m + '分';
  return m + '分';
}

// GalaxyGlass 建站时间（这里写死日期，需要改请改这里）
const SITE_START = new Date('2026-05-01T21:34:00+08:00').getTime();

function siteUptime() {
  const now = Date.now();
  const diff = Math.max(0, now - SITE_START);
  const totalSeconds = Math.floor(diff / 1000);
  const s = totalSeconds % 60;
  const totalMins = Math.floor(totalSeconds / 60);
  const m = totalMins % 60;
  const totalHours = Math.floor(totalMins / 60);
  const h = totalHours % 24;
  const totalDays = Math.floor(totalHours / 24);
  const totalMonths = Math.floor(totalDays / 30);
  const mo = totalMonths % 12;
  const y = Math.floor(totalMonths / 12);
  const d = totalDays % 30;
  let res = '';
  if (y > 0) res += y + ' 年 ';
  if (mo > 0) res += mo + ' 月 ';
  if (d > 0 || res === '') res += d + ' 日 ';
  res += h + ' 时 ' + m + ' 分';
  return res;
}

function updateFooterUptime() {
  const el = document.getElementById('footer-uptime');
  if (el) el.textContent = '🛰️ 本站已稳定运行 ' + siteUptime() + ' 🌌';
}

setInterval(updateFooterUptime, 1000);
updateFooterUptime();

function age(ts) {
  if (!ts) return '-';
  const diff = Date.now() - new Date(ts).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + '分钟前';
  const h = Math.floor(mins / 60);
  if (h < 24) return h + '小时前';
  return Math.floor(h / 24) + '天前';
}

function metricClass(v) {
  if (v >= 90) return 'high';
  if (v >= 70) return 'medium';
  return 'low';
}

function flagEmoji(code) {
  if (!code) return '';
  // Komari 1.2: region already returns emoji flags like 🇺🇸 🇭🇰 🇯🇵 etc.
  // These ARE the display values, not codes — extract country code from emoji
  const emojiToCode = { '🇺🇸': 'us', '🇯🇵': 'jp', '🇭🇰': 'hk', '🇰🇷': 'kr', '🇸🇬': 'sg', '🇩🇪': 'de', '🇬🇧': 'gb', '🇫🇷': 'fr', '🇨🇳': 'cn', '🇹🇼': 'tw', '🇦🇺': 'au', '🇨🇦': 'ca', '🇬🇺': 'gu', '🇵🇭': 'ph', '🇲🇾': 'my', '🇮🇳': 'in', '🇷🇺': 'ru', '🇳🇱': 'nl', '🇰🇿': 'kz', '🇧🇷': 'br', '🇹🇷': 'tr', '🇪🇺': 'eu', '🇺🇳': 'un' };
  if (emojiToCode[code]) return emojiToCode[code];
  // Fallback: if it looks like a country code (2 uppercase letters)
  const c = code.trim().toUpperCase();
  if (/^[A-Z]{2}$/.test(c)) return c.toLowerCase();
  // Legacy text → code mapping (for pre-1.2 data)
  const regionMap = { '东京': 'jp', '日本': 'jp', '大阪': 'jp', '香港': 'hk', '台湾': 'tw', '新加坡': 'sg', '首尔': 'kr', '韩国': 'kr', '洛杉矶': 'us', '纽约': 'us', '硅谷': 'us', '圣何塞': 'us', '法兰克福': 'de', '德国': 'de', '伦敦': 'gb', '英国': 'gb', '澳大利亚': 'au', '澳洲': 'au' };
  const mapped = regionMap[c] || regionMap[code.trim()];
  return mapped || '';
}

// Merge node static info with dynamic data
function mergeNodeData(node, recent) {
  if (!recent || recent.length === 0) {
    return { ...node, online: false };
  }
  
  const latest = recent[0];
  return {
    ...node,
    online: true,
    cpu_usage: latest.cpu?.usage || 0,
    memory_total: latest.ram?.total || 0,
    memory_used: latest.ram?.used || 0,
    memory_usage: latest.ram?.total > 0 ? (latest.ram.used / latest.ram.total) * 100 : 0,
    disk_total: latest.disk?.total || 0,
    disk_used: latest.disk?.used || 0,
    disk_usage: latest.disk?.total > 0 ? (latest.disk.used / latest.disk.total) * 100 : 0,
    network_in: latest.network?.down || 0,
    network_out: latest.network?.up || 0,
    network_total_received: latest.network?.totalDown || 0,
    network_total_transmitted: latest.network?.totalUp || 0,
    uptime: latest.uptime || 0,
    last_update: latest.updated_at || null,
    cpu_name: node.cpu_name || '',
    virtualization: node.virtualization || '',
    region: node.region || '',
    tags_list: node.tags ? String(node.tags).split(',').filter(t => t.trim()) : [],
  };
}

// Sort & Filter
function getFiltered() {
  let arr = [...nodesList];
  
  // Online first
  arr.sort((a, b) => {
    if (a.online !== b.online) return a.online ? -1 : 1;
    
    const cpu = (n) => n.cpu_usage || 0;
    const mem = (n) => n.memory_usage || 0;
    const disk = (n) => n.disk_usage || 0;
    const netIn = (n) => n.network_in || 0;
    const netOut = (n) => n.network_out || 0;
    const up = (n) => n.uptime || 0;
    
    let cmp = 0;
    switch (sortMode) {
      case 'cpu': cmp = cpu(b) - cpu(a); break;
      case 'mem': cmp = mem(b) - mem(a); break;
      case 'disk': cmp = disk(b) - disk(a); break;
      case 'netIn': cmp = netIn(b) - netIn(a); break;
      case 'netOut': cmp = netOut(b) - netOut(a); break;
      case 'uptime': cmp = up(b) - up(a); break;
      case 'name': cmp = (a.name || a.uuid).localeCompare(b.name || b.uuid); break;
      case 'region': cmp = (a.region || '').localeCompare(b.region || ''); break;
    }
    if (cmp !== 0) return cmp;
    return (a.name || a.uuid).localeCompare(b.name || b.uuid);
  });
  
  // Region filter
  if (filterRegion) {
    arr = arr.filter(n => n.region === filterRegion);
  }
  
  // Tag filter
  if (filterTag) {
    arr = arr.filter(n => n.tags && n.tags.includes(filterTag));
  }
  
  // Search
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    arr = arr.filter(n => {
      const hay = [n.uuid, n.name, n.os, n.virtualization, n.cpu_name, ...(n.tags_list || [])].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  
  return arr;
}

// USD→CNY 汇率（异步获取，缓存 1 小时）
let exchangeRate = 6.84; // 默认值
async function fetchExchangeRate() {
  try {
    const cached = localStorage.getItem('usd_cny_rate');
    if (cached) {
      const { rate, ts } = JSON.parse(cached);
      if (Date.now() - ts < 3600000) { exchangeRate = rate; return; }
    }
    const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
    const data = await res.json();
    exchangeRate = data.rates.CNY || 6.84;
    localStorage.setItem('usd_cny_rate', JSON.stringify({ rate: exchangeRate, ts: Date.now() }));
  } catch { exchangeRate = 6.84; }
}
function toCNY(price, currency) {
  const p = parseFloat(price) || 0;
  if (!currency) return p;
  const c = currency.toUpperCase();
  // USD, $, USDT, US 均视为美元
  if (c === 'USD' || c === '$' || c === 'USDT' || c === 'US') return p * exchangeRate;
  return p;
}

// Update stats
function updateStats() {
  const total = nodesList.length;
  const online = nodesList.filter(n => n.online).length;
  // 累计总量
  let totalTx = 0, totalRx = 0;
  // 瞬时速
  let curNetOut = 0, curNetIn = 0;

  nodesList.forEach(n => {
    totalTx += n.network_total_transmitted || 0;
    totalRx += n.network_total_received || 0;
    curNetOut += n.network_out || 0;
    curNetIn += n.network_in || 0;
  });

  // 实时速率：delta / 时间差
  const now = Date.now();
  const dt = _lastNetTs ? (now - _lastNetTs) / 1000 : 0;
  let rateOut = 0, rateIn = 0;
  if (dt > 0) {
    rateOut = Math.max(0, (totalTx - _lastNetTx) / dt);
    rateIn  = Math.max(0, (totalRx - _lastNetRx) / dt);
  }
  _lastNetTx = totalTx;
  _lastNetRx = totalRx;
  _lastNetTs = now;

  // 剩余价值 = Σ(价格_CNY × 剩余天数 / 周期天数)
  const totalValue = nodesList.reduce((sum, n) => sum + toCNY(n.price, n.currency), 0);
  const remainingValue = nodesList.reduce((sum, n) => {
    const price = toCNY(n.price, n.currency);
    const cycle = parseInt(n.billing_cycle) || 30;
    const expiredAt = n.expired_at ? new Date(n.expired_at).getTime() : now + cycle * 86400000;
    const remainMs = expiredAt - now;
    const remainDays = Math.max(0, remainMs / 86400000);
    const ratio = Math.min(1, remainDays / cycle);
    return sum + price * ratio;
  }, 0);

  document.getElementById('stat-online').textContent = online;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-received').textContent = bytes(totalRx);
  document.getElementById('stat-transmitted').textContent = bytes(totalTx);
  document.getElementById('stat-netout').textContent = bytes(rateOut) + '/s';
  document.getElementById('stat-netin').textContent = bytes(rateIn) + '/s';
  document.getElementById('stat-total-val').textContent = '¥' + totalValue.toFixed(0);
  document.getElementById('stat-remain-val').textContent = '¥' + remainingValue.toFixed(0);
}

  }
  
  updateStats();
}

function setupScroll() {

  const backToTop = document.getElementById('back-to-top');

  // Poll scrollY — scroll events may be intercepted by Cloudflare overlay
  let isScrolled = false;
  setInterval(() => {

    if (y > 25 && !isScrolled) {
      isScrolled = true;
      navbar.classList.add('scrolled');

      isScrolled = false;
      navbar.classList.remove('scrolled');

  video.play().then(() => {
    video.style.opacity = '1';
    poster.style.opacity = '0';
  }).catch(() => { poster.style.opacity = '1'; });

  // Apply blur from theme config
  const blur = siteInfo.blurValue || 20;
  document.querySelectorAll('.glass-card, .stat-card, .glass-badge, .node-card').forEach(el => {
    el.style.backdropFilter = `blur(${blur}px)`;

  if (siteInfo.sitename) {

    nodeList.map(async (node) => {

      return mergeNodeData(node, recent);
    })
  );
  
  nodesList = merged;

  // 预取汇率，获取后立即更新统计卡
  fetchExchangeRate().then(updateStats);

  // Build tag filter UI
  buildRegionFilters();
  function updateTime() {
    document.getElementById('stat-time').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  }
  updateTime();
  setInterval(updateTime, 1000);
  
  // Render
  render();
  
  // Events
  setupEvents();
  setupScroll();
  
  // Refresh data periodically
  setInterval(async () => {
    const refreshed = await Promise.all(
      nodeList.map(async (node) => {
        const recent = await fetchRecentData(node.uuid);
        return mergeNodeData(node, recent);
      })
    );
    nodesList = refreshed;
    render();
  }, 30000); // 30s refresh
}

init().catch(e => console.error('INIT ERROR:', e));
setupRouter();

// Build region filter buttons only
function buildRegionFilters() {
  const regionMap = new Map();
  nodesList.forEach(n => {
    const r = n.region || '';
    if (r) regionMap.set(r, (regionMap.get(r) || 0) + 1);
  });
  const regions = [...regionMap.entries()].sort((a, b) => b[1] - a[1]);
  
  const rContainer = document.getElementById('region-filters');
  if (rContainer) {
    if (regions.length > 0) {
      const rBtns = regions.map(([r, count]) => {
        const active = filterRegion === r;
        const s = active
          ? 'border-color:#10b981;color:#10b981;'
          : 'border-color:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);';
        const flagCode = flagEmoji(r);
        const flagImg = flagCode ? `<img src="https://flagcdn.com/${flagCode}.svg" alt="${r}" style="width:20px;height:14px;object-fit:cover;border-radius:2px;vertical-align:middle;margin-right:6px;" loading="lazy" onerror="this.style.display='none'">` : '';
        return `<button class="glass-badge" style="${s}" data-region="${r}">${flagImg}${flagCode ? flagCode.toUpperCase() : r}</button>`;
      }).join('');
      const allActive = filterRegion === null;
      const allS = allActive
        ? 'border-color:#10b981;color:#10b981;'
        : 'border-color:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);';
      rContainer.innerHTML = `<div class="filters" style="display:flex;flex-wrap:wrap;gap:8px;">` +
        `<button class="glass-badge" style="${allS}" data-region="">全部</button>` +
        rBtns + `</div>`;
      rContainer.querySelectorAll('button').forEach(btn => {
        btn.style.cssText += 'background:rgba(255,255,255,0.05);';
        btn.addEventListener('click', () => {
          filterRegion = btn.dataset.region || null;
          buildRegionFilters();
          render();
        });
      });
    } else {
      rContainer.innerHTML = '';
    }
  }
}

// ──────────────────────────────────────
// History API Router + Detail View
// ──────────────────────────────────────

function showDetailView(nodeUuid) {
  const detailView = document.getElementById('detail-view');
  const listView = document.getElementById('list-view');
  if (!detailView || !listView) return;

  // Show detail, hide list
  detailView.classList.remove('hidden');
  listView.classList.add('hidden');

  // Scroll to top
  window.scrollTo(0, 0);

  // Load detail data
  loadDetailData(nodeUuid);
}

function showListView() {
  window.removeEventListener('resize', drawDetailCharts);
  window._detailChartData = null;
  const detailView = document.getElementById('detail-view');
  const listView = document.getElementById('list-view');
  if (detailView) detailView.classList.add('hidden');
  if (listView) listView.classList.remove('hidden');
  window.scrollTo(0, 0);
}

function loadDetailData(uuid) {
  const loading = document.getElementById('detail-loading');
  const error = document.getElementById('detail-error');
  const content = document.getElementById('detail-content');

  loading.classList.remove('hidden');
  error.classList.add('hidden');
  content.classList.add('hidden');

  Promise.all([
    fetch('/api/nodes').then(r => r.json()),
    fetch('/api/recent/' + uuid).then(r => r.json())
  ]).then(([nodesData, recentData]) => {
    const node = (nodesData.data || []).find(n => n.uuid === uuid);
    const recent = recentData.data || [];

    if (!node) {
      loading.classList.add('hidden');
      error.textContent = '未找到该节点';
      error.classList.remove('hidden');
      return;
    }

    // Title
    document.getElementById('detail-name').textContent = node.name || node.uuid;
    document.getElementById('detail-meta').textContent = [
      node.region, node.virtualization, (node.os || '').split(' ')[0]
    ].filter(Boolean).join(' · ');

    // Metrics
    const latest = recent[0] || {};
    renderDetailMetrics(node, latest);
    renderDetailSysinfo(node, latest);

    // Charts
    const pts = [...recent].reverse();
    const cpuPts = pts.map(r => r.cpu?.usage || 0);
    const memPts = pts.map(r => {
      const total = r.ram?.total || node.mem_total || 1;
      const used = r.ram?.used || 0;
      return total > 0 ? (used / total) * 100 : 0;
    });
    const upPts = pts.map(r => r.network?.up || 0);
    const downPts = pts.map(r => r.network?.down || 0);

    document.getElementById('badge-cpu').textContent = cpuPts.length ? cpuPts[cpuPts.length - 1].toFixed(1) + '%' : '—';
    document.getElementById('badge-mem').textContent = memPts.length ? memPts[memPts.length - 1].toFixed(1) + '%' : '—';
    document.getElementById('badge-net').textContent = upPts.length ? '↑ ' + bytes(upPts[upPts.length - 1]) + '/s · ↓ ' + bytes(downPts[downPts.length - 1]) + '/s' : '—';

    loading.classList.add('hidden');
    content.classList.remove('hidden');

    // Draw charts after layout
    requestAnimationFrame(() => requestAnimationFrame(() => {
      drawDetailLine('chart-cpu', cpuPts, '#10b981', 'rgba(16,185,129,0.15)');
      drawDetailLine('chart-mem', memPts, '#a855f7', 'rgba(168,85,247,0.15)');
      drawDetailNet('chart-net', upPts, downPts, pts);
    }));

    // Store data for resize redraw
    window._detailChartData = { cpuPts, memPts, upPts, downPts, pts, node };

    // Resize redraw
    window.addEventListener('resize', drawDetailCharts);
  }).catch(err => {
    loading.classList.add('hidden');
    error.textContent = '加载失败: ' + err.message;
    error.classList.remove('hidden');
  });
}

function drawDetailCharts() {
  const d = window._detailChartData;
  if (!d) return;
  drawDetailLine('chart-cpu', d.cpuPts, '#10b981', 'rgba(16,185,129,0.15)');
  drawDetailLine('chart-mem', d.memPts, '#a855f7', 'rgba(168,85,247,0.15)');
  drawDetailNet('chart-net', d.upPts, d.downPts, d.pts);
}

function renderDetailMetrics(node, latest) {
  const cpu = latest?.cpu?.usage || 0;
  const memPct = node.mem_total > 0 ? ((latest.ram?.used || 0) / node.mem_total) * 100 : 0;
  const diskPct = node.disk_total > 0 ? ((latest.disk?.used || 0) / node.disk_total) * 100 : 0;
  const netUp = latest?.network?.up || 0;
  const netDown = latest?.network?.down || 0;

  document.getElementById('detail-metrics').innerHTML = [
    { label: 'CPU', value: cpu.toFixed(1) + '%', pct: cpu, cls: metricClass(cpu) },
    { label: '内存', value: memPct.toFixed(1) + '%', pct: memPct, cls: metricClass(memPct) },
    { label: '磁盘', value: diskPct.toFixed(1) + '%', pct: diskPct, cls: metricClass(diskPct) },
    { label: '在线时长', value: uptime(latest?.uptime) },
    { label: '上行', value: bytes(netUp) + '/s' },
    { label: '下行', value: bytes(netDown) + '/s' },
  ].map(m => `
    <div class="metric-card">
      <span class="metric-label">${m.label}</span>
      <span class="metric-value">${m.value}</span>
      ${m.pct !== undefined ? `<div class="metric-bar"><div class="metric-fill ${m.cls}" style="width:${Math.min(100, m.pct)}%"></div></div>` : ''}
    </div>
  `).join('');
}

function renderDetailSysinfo(node, latest) {
  const cpuCores = node.cpu_cores || '-';
  const swapTotal = node.swap_total || 0;
  const load1 = latest?.load?.load1 ?? latest?.load1 ?? null;
  const load5 = latest?.load?.load5 ?? latest?.load5 ?? null;
  const load15 = latest?.load?.load15 ?? latest?.load15 ?? null;
  const trafficLimit = node.traffic_limit || 0;
  const process = latest?.process || '-';
  const tcp = latest?.connections?.tcp || '-';
  const cores = typeof cpuCores === 'number' ? cpuCores : 1;

  function loadCls(v) {
    if (v >= cores * 2) return 'high';
    if (v >= cores * 1) return 'medium';
    return 'low';
  }

  const rows = [
    { lbl: 'CPU 型号', val: node.cpu_name || '-' },
    { lbl: '核心数', val: cpuCores !== '-' ? '× ' + cpuCores : '-' },
    { lbl: '架构', val: node.arch || '-' },
    { lbl: '虚拟化', val: node.virtualization || '-' },
    { lbl: '操作系统', val: (node.os || '-').split(' ').slice(0, 2).join(' ') },
    { lbl: 'GPU', val: (node.gpu_name && node.gpu_name !== 'None') ? node.gpu_name : '-' },
    { lbl: '内存总量', val: bytes(node.mem_total) },
    { lbl: 'Swap 总量', val: swapTotal > 0 ? bytes(swapTotal) : '无' },
    { lbl: '磁盘总量', val: bytes(node.disk_total) },
    { lbl: '流量限额', val: trafficLimit > 0 ? bytes(trafficLimit) : '无' },
    { lbl: '到期时间', val: node.expired_at ? new Date(node.expired_at).toLocaleDateString('zh-CN') : '-' },
    { lbl: '在线时长', val: uptime(latest?.uptime) },
    { lbl: '进程数', val: process },
    { lbl: 'TCP 连接', val: tcp },
    { lbl: '最后更新', val: age(latest?.updated_at) },
  ];

  if (load1 !== null) {
    const idx = rows.findIndex(r => r.lbl === '在线时长');
    rows.splice(idx + 1, 0, { lbl: '负载均值', isLoad: true, v1: load1, v5: load5, v15: load15, cores });
  }

  document.getElementById('detail-sysinfo').innerHTML = rows.map(r => {
    if (r.isLoad) {
      return `<div class="sysinfo-row">
        <span class="lbl">${r.lbl}</span>
        <div class="load-row">
          <span class="load-badge ${loadCls(r.v1)}">1m ${r.v1}</span>
          <span class="load-badge ${loadCls(r.v5)}">5m ${r.v5}</span>
          <span class="load-badge ${loadCls(r.v15)}">15m ${r.v15}</span>
        </div>
      </div>`;
    }
    return `<div class="sysinfo-row"><span class="lbl">${r.lbl}</span><span class="val">${r.val}</span></div>`;
  }).join('');
}

function drawDetailLine(canvasId, points, color, bgColor) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.offsetWidth;
  const h = 160;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  if (!points || points.length < 2) {
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('数据不足', w / 2, h / 2 + 4);
    return;
  }

  const min = Math.min(...points);
  const max = Math.max(...points);
  const range = max - min || 1;
  const stepX = w / (points.length - 1);
  const padY = 14;
  const chartH = h - padY * 2;

  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  [0.25, 0.5, 0.75, 1].forEach(ratio => {
    const y = padY + (1 - ratio) * chartH + 0.5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  });

  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, bgColor);
  grad.addColorStop(1, 'rgba(0,0,0,0)');

  const linePts = points.map((v, i) => ({
    x: i * stepX,
    y: padY + (1 - (v - min) / range) * chartH
  }));

  ctx.beginPath();
  linePts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.lineTo(linePts[linePts.length - 1].x, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.shadowColor = color;
  ctx.shadowBlur = 6;
  ctx.beginPath();
  linePts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawDetailNet(canvasId, upPoints, downPoints, pts) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.offsetWidth;
  const h = 160;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const len = Math.min(upPoints.length, downPoints.length);
  if (len < 2) {
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('数据不足', w / 2, h / 2 + 4);
    return;
  }

  const all = [...upPoints.slice(0, len), ...downPoints.slice(0, len)];
  const max = Math.max(...all) || 1;
  const padY = 14;
  const chartH = h - padY * 2;
  const stepX = w / (len - 1);

  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(bytes(max) + '/s', 4, 10);

  ctx.textAlign = 'left';
  ctx.fillText(pts[0] ? new Date(pts[0].updated_at).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) : '', 4, h - 2);
  ctx.textAlign = 'right';
  ctx.fillText(pts[len-1] ? new Date(pts[len-1].updated_at).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) : '', w - 4, h - 2);

  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  [0.25, 0.5, 0.75, 1].forEach(ratio => {
    const y = padY + (1 - ratio) * chartH + 0.5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  });

  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  const legX = w - 10;
  ctx.fillStyle = '#f97316';
  ctx.fillRect(legX - 64, 4, 16, 2);
  ctx.fillText('↑ 上行', legX, 10);
  ctx.fillStyle = '#10b981';
  ctx.fillRect(legX - 64, 16, 16, 2);
  ctx.fillText('↓ 下行', legX, 22);

  function drawLinePts(pts, color) {
    const linePts = pts.slice(0, len).map((v, i) => ({
      x: i * stepX,
      y: padY + (1 - v / max) * chartH
    }));

    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, color.replace(')', ',0.2)').replace('rgb', 'rgba'));
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    linePts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.lineTo(linePts[linePts.length - 1].x, h);
    ctx.lineTo(0, h);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.shadowColor = color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    linePts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  drawLinePts(upPoints, '#f97316');
  drawLinePts(downPoints, '#10b981');
}

// ── Router setup ──
function setupRouter() {
  // Detail nav scroll glass effect
  const detailNav = document.getElementById('detail-nav');
  let detailScrollTimer = null;
  window.addEventListener('scroll', () => {
    if (!detailNav) return;
    clearTimeout(detailScrollTimer);
    detailScrollTimer = setTimeout(() => {
      detailNav.classList.toggle('scrolled', window.scrollY > 10);
    }, 50);
  }, { passive: true });

  // Remove resize listener when leaving detail
  const origShowDetail = showDetailView;
  let _resizeHandler = null;

  // Handle back/forward button
  window.addEventListener('popstate', (e) => {
    const path = window.location.pathname;
    const match = path.match(/^\/instance\/(.+)$/);
    if (match && match[1]) {
      showDetailView(decodeURIComponent(match[1]));
    } else {
      showListView();
    }
  });

  // Detail back button
  document.getElementById('detail-back').addEventListener('click', () => {
    history.pushState(null, '', '/');
    showListView();
  });

  // Check initial path
  const path = window.location.pathname;
  const match = path.match(/^\/instance\/(.+)$/);
  if (match && match[1]) {
    showDetailView(decodeURIComponent(match[1]));
  }
}
