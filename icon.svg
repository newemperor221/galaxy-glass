<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e152e"/>
      <stop offset="100%" stop-color="#060a18"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Glass crystal / faceted gem shape -->
  <polygon points="32,4 58,20 58,44 32,60 6,44 6,20" fill="url(#bg)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8"/>
  <!-- Top facet (green) -->
  <polygon points="32,4 6,20 32,32 58,20" fill="url(#g1)" opacity="0.85"/>
  <!-- Left facet (indigo) -->
  <polygon points="6,20 6,44 32,32" fill="url(#g2)" opacity="0.7"/>
  <!-- Right facet (lighter green) -->
  <polygon points="58,20 58,44 32,32" fill="url(#g3)" opacity="0.6"/>
  <!-- Bottom facet (dark) -->
  <polygon points="6,44 32,60 58,44 32,32" fill="#0e152e" opacity="0.5"/>
  <!-- Glass highlight reflection -->
  <polygon points="14,24 14,34 24,28" fill="#fff" opacity="0.15"/>
  <polygon points="50,24 50,34 44,28" fill="#fff" opacity="0.08"/>
</svg>
